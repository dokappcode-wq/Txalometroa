<style>
/* Réplica local de hikateatroa.eus/txalometroa para probar el circuito
   votar -> analizar -> publicar. Solo para pruebas: no se publica. */
:root {
  --gorria: #ff3c42; --testua: #595b60; --iluna: #231f20; --grisa: #85868a;
  --lerroa: #e6e6e8; --oina: #4a4b4f; --demo: #111214;
  --raleway: Raleway, "Segoe UI", system-ui, sans-serif; --slab: "Roboto Slab", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #fff; color: var(--testua); font: 18px/1.55 var(--raleway); }
a { color: var(--gorria); text-decoration: none; }
img { max-width: 100%; }
.edukiontzia { max-width: 1140px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }

/* Franja de aviso */
.demo-franja { background: var(--demo); color: #fff; font-size: 13px; text-align: center; padding: 7px 16px; letter-spacing: .02em; }
.demo-franja b { color: #ffd34d; font-weight: 700; letter-spacing: .08em; }

/* Cabecera */
header.gunea { padding-top: 22px; }
.logoa { display: block; width: min(250px, 60vw); margin: 0 auto; }
nav.menua { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 26px; padding: 18px 20px 16px; }
nav.menua a { color: var(--grisa); text-transform: uppercase; font-size: 15px; letter-spacing: .02em; }
nav.menua a:hover, nav.menua a.aktibo { color: var(--gorria); }
nav.menua .hizkuntzak { display: inline-flex; gap: 10px; margin-left: 8px; }
nav.menua .hizkuntzak button { background: none; border: 0; padding: 0; font: 600 15px var(--raleway); color: var(--grisa); cursor: pointer; }
nav.menua .hizkuntzak button[aria-pressed="true"] { color: var(--gorria); }
.menu-botoia { display: none; margin: 14px auto 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 14px; font: 600 15px var(--raleway); color: var(--testua); }
@media (max-width: 900px) {
  .menu-botoia { display: block; }
  nav.menua { flex-direction: column; gap: 10px; }
  nav.menua.itxita a:not(.hizkuntzak *) { display: none; }
}

/* Portada */
.azala { position: relative; height: clamp(200px, 26vw, 342px); background: #4d3733 center 35% / cover no-repeat; display: grid; place-items: center; }
.azala::before { content: ""; position: absolute; inset: 0; background: rgba(77, 55, 51, .45); }
.azala h2 { position: relative; margin: 0; color: #fff; font: 300 clamp(36px, 5vw, 60px) var(--slab); letter-spacing: .02em; }

/* Lista de obras (como en la web) */
.zerrenda { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 28px; margin-top: 84px; }
.txartela { position: relative; display: block; aspect-ratio: 3 / 2; overflow: hidden; background: #ddd; }
.txartela img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
.txartela:hover img { transform: scale(1.04); }
.txartela .info { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, .86); padding: 12px 24px 14px; }
.txartela .titulo { display: block; color: var(--testua); font-weight: 700; font-size: 26px; line-height: 1.2; }
.txalotu { display: inline-flex; align-items: center; gap: 10px; color: var(--gorria); font-size: 20px; text-transform: uppercase; }
.txalotu img { width: 30px; height: 30px; }

/* Bloque insertado */
.emaitzak-gunea { margin-top: 90px; position: relative; }
.bloke-marka { position: absolute; top: -26px; left: 0; font: 600 11px var(--raleway); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--demo); padding: 4px 10px; border-radius: 4px 4px 0 0; }
.erakutsi-blokea .emaitzak-gunea { outline: 2px dashed rgba(17, 18, 20, .55); outline-offset: 10px; border-radius: 4px; }
.erakutsi-blokea .emaitzak-gunea .bloke-marka { top: -36px; left: -10px; }
.emaitzak-gunea:not(.erakutsi) .bloke-marka { display: none; }
@keyframes distira { 0% { box-shadow: 0 0 0 0 rgba(255, 60, 66, .55); } 100% { box-shadow: 0 0 0 18px rgba(255, 60, 66, 0); } }
.berria .txalo-obra { animation: distira 1.2s ease-out 2; }

/* Formulario */
.atzera { display: inline-flex; gap: 8px; align-items: center; margin-top: 40px; font-size: 16px; }
.galdetegia { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; margin-top: 24px; align-items: start; }
@media (max-width: 860px) { .galdetegia { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.obra-irudia { position: sticky; top: 20px; }
.obra-irudia img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; border-radius: 4px; }
.obra-irudia h2 { font: 700 34px/1.15 var(--raleway); color: var(--testua); margin: 16px 0 6px; }
.obra-irudia p { margin: 0; font-size: 16px; }
.aurpegiak { display: grid; grid-template-columns: minmax(0, 1fr) 190px; align-items: center; margin-bottom: 4px; }
.aurpegiak div { grid-column: 2; display: flex; justify-content: space-between; padding-right: 44px; }
.aurpegiak img, .aurpegiak svg { width: 28px; height: 30px; }
.galdera { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px 20px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--lerroa); }
.galdera label { font-size: 17px; line-height: 1.35; }
.galdera .eskala { display: flex; align-items: center; gap: 12px; }
.galdera output { width: 32px; text-align: right; font-weight: 700; font-size: 22px; color: #b4b5b8; font-variant-numeric: tabular-nums; }
.galdera output.jarrita { color: var(--gorria); }
@media (max-width: 560px) { .galdera, .aurpegiak { grid-template-columns: minmax(0, 1fr); } .aurpegiak div { grid-column: 1; } }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--gorria) var(--bete, 0%), #dcdcde var(--bete, 0%)); outline-offset: 6px; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--gorria); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--gorria); }
.bidali { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.botoia { display: inline-flex; align-items: center; gap: 12px; background: var(--gorria); color: #fff; border: 0; border-radius: 40px; padding: 14px 30px; font: 600 20px var(--raleway); letter-spacing: .04em; cursor: pointer; }
.botoia:disabled { opacity: .45; cursor: not-allowed; }
.botoia.bigarren { background: #fff; color: var(--gorria); border: 2px solid var(--gorria); }
.oharra { font-size: 15px; color: var(--grisa); }
.oharra.errorea { color: #c4161c; }

/* Gracias */
.eskerrik { text-align: center; margin-top: 56px; }
.eskerrik h2 { font: 300 clamp(40px, 6vw, 64px) var(--slab); color: var(--iluna); margin: 0; }
.eskerrik p { margin: 8px auto 0; max-width: 46ch; }
.aldaketa { display: inline-flex; align-items: center; gap: 12px; margin-top: 20px; padding: 10px 20px; border-radius: 40px; background: #fff0f0; color: var(--iluna); font-weight: 600; font-variant-numeric: tabular-nums; }
.aldaketa .gezia { color: var(--gorria); }
.eskerrik .txalo-emaitzak { max-width: 420px; margin: 32px auto 0; text-align: left; }
.eskerrik .bidali { justify-content: center; }
.konfetia { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

/* Pie */
.babesleak { margin-top: 110px; padding: 0 20px 20px; }
.babesleak img { display: block; margin: 0 auto; max-width: 1000px; width: 100%; }
footer { background: #e9e9ea; color: var(--testua); font-size: 16px; }
footer .edukiontzia { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding-block: 22px; }
footer img { width: 92px; filter: brightness(.35); }

/* Panel de prueba */
.demo-panela { position: fixed; right: 16px; bottom: 16px; z-index: 50; width: min(340px, calc(100vw - 32px)); background: var(--demo); color: #e9e9ea; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
.demo-panela > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; color: #fff; font: 700 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 12px 16px; cursor: pointer; }
.demo-panela > button span { color: #ffd34d; }
.demo-gorputza { padding: 0 16px 16px; display: grid; gap: 12px; max-height: calc(100vh - 90px); overflow-y: auto; }
.demo-gorputza .zbk { font-size: 30px; font-weight: 700; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
.demo-gorputza fieldset { border: 1px solid #33353a; border-radius: 10px; padding: 8px 12px 10px; margin: 0; display: grid; gap: 6px; }
.demo-gorputza legend { padding: 0 4px; color: #a9abb0; font-size: 12px; }
.demo-gorputza label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.demo-gorputza .lauso { color: #a9abb0; font-size: 12.5px; }
.demo-gorputza .botoiak { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-gorputza .botoiak button { background: #26282d; color: #fff; border: 1px solid #3a3d43; border-radius: 8px; padding: 7px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
.demo-gorputza .botoiak button.nagusia { background: var(--gorria); border-color: var(--gorria); }

/* Obras sin foto y estados vacíos */
.txartela.irudi-gabe { background: linear-gradient(135deg, #3a2b29, #6b4d47); }
.txartela .hizki { position: absolute; inset: 0 0 30% 0; display: grid; place-items: center; font: 300 96px var(--slab); color: rgba(255,255,255,.55); }
.obra-irudia .ordezko { aspect-ratio: 3 / 2; border-radius: 4px; background: linear-gradient(135deg, #3a2b29, #6b4d47); display: grid; place-items: center; font: 300 120px var(--slab); color: rgba(255,255,255,.55); }
@keyframes estreinaldia { 0% { box-shadow: 0 0 0 0 rgba(255, 60, 66, .7); } 100% { box-shadow: 0 0 0 22px rgba(255, 60, 66, 0); } }
.txartela.berria { animation: estreinaldia 1.1s ease-out 3; }
.txartela .estreinua { position: absolute; top: 14px; left: 14px; background: var(--gorria); color: #fff; font: 700 12px var(--raleway); letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 3px; }
.hutsik { margin-top: 84px; text-align: center; border: 2px dashed var(--lerroa); border-radius: 12px; padding: 56px 20px; }
.hutsik h3 { font: 300 32px var(--slab); color: var(--iluna); margin: 0 0 8px; }
.hutsik p { margin: 0 auto; max-width: 52ch; font-size: 16px; }
.emaitzak-hutsik { text-align: center; }
.emaitzak-hutsik h3 { font-weight: 300; font-size: 2.2rem; margin: 0; }
.emaitzak-hutsik p { font-size: .95rem; opacity: .8; }

/* Panel: controles de administración */
.demo-gorputza input[type=number] { width: 60px; font: 14px system-ui, sans-serif; padding: 4px 6px; border-radius: 6px; border: 1px solid #3a3d43; background: #1c1e22; color: #fff; }
.demo-gorputza .botoiak button.armado { background: #8a1c1f; border-color: #c4161c; }
.demo-gorputza .botoiak button:disabled { opacity: .4; cursor: not-allowed; }
.demo-gorputza .abisua { background: #2e2312; color: #f0b860; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.demo-gorputza .abisua button { margin-top: 6px; width: 100%; background: #ff3c42; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
.demo-gorputza .oharra-panel { color: #ffd34d; font-size: 12.5px; min-height: 1em; }
.obra-zerrenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.obra-zerrenda li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.obra-zerrenda .miniatura { width: 34px; height: 24px; border-radius: 3px; object-fit: cover; background: linear-gradient(135deg, #3a2b29, #6b4d47); display: block; }
.obra-zerrenda .izena { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
.obra-zerrenda .izena small { display: block; color: #a9abb0; font-size: 11.5px; }
.obra-zerrenda button { background: #26282d; color: #fff; border: 1px solid #3a3d43; border-radius: 6px; padding: 4px 8px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
.obra-zerrenda button.armado { background: #8a1c1f; border-color: #c4161c; }
.demo-gorputza label.lerro { align-items: center; }

/* Ventanas: obras nuevas del export y añadir obra */
.modala { position: fixed; inset: 0; z-index: 70; background: rgba(17, 18, 20, .6); display: grid; place-items: center; padding: 16px; }
.modala .kutxa { background: #fff; color: var(--testua); border-radius: 14px; width: min(900px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.4); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }

.modala p { margin: 0 0 14px; font-size: 14px; }
.modala .scroll { overflow-x: auto; }
table.nuevas { border-collapse: collapse; width: 100%; font-size: 14px; }
table.nuevas th { text-align: left; font-weight: 600; color: var(--grisa); padding: 6px 8px; white-space: nowrap; border-bottom: 1px solid var(--lerroa); }
table.nuevas td { padding: 8px; border-bottom: 1px solid var(--lerroa); vertical-align: middle; }
table.nuevas select, table.nuevas input { font: 14px system-ui, sans-serif; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; width: 100%; min-width: 180px; }
.sugerido { display: inline-block; font-size: 11px; font-weight: 700; color: #c4161c; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
.modala .bidali { margin-top: 18px; }
.modala .botoia { font-size: 16px; padding: 10px 22px; }
.obra-berria { display: grid; gap: 6px; }
.obra-berria > label, .obra-berria .etiketa { font-weight: 600; font-size: 14px; color: var(--iluna); margin-top: 8px; }
.obra-berria label span { font-weight: 400; color: var(--grisa); }
.obra-berria input[type=text], .obra-berria input[type=url] { font: 15px system-ui, sans-serif; padding: 9px 10px; border: 1px solid #ccc; border-radius: 8px; width: 100%; }
.argazkia { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; align-items: center; }
@media (max-width: 560px) { .argazkia { grid-template-columns: minmax(0, 1fr); } }
.aurrebista { aspect-ratio: 3 / 2; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #3a2b29, #6b4d47); display: grid; place-items: center; color: rgba(255,255,255,.7); font-size: 13px; }
.aurrebista img { width: 100%; height: 100%; object-fit: cover; display: block; }
.argazkia .aukerak { display: grid; gap: 8px; }
.botoia.txikia { font-size: 14px; padding: 8px 16px; justify-content: center; cursor: pointer; }
#soltar { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(17, 18, 20, .82); color: #fff; font: 300 40px var(--slab); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, label.botoia:focus-within { outline: 2px solid var(--gorria); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .txartela img, .berria .txalo-obra, .txartela.berria { transition: none; animation: none; } html { scroll-behavior: auto; } }
</style>

<script>
"use strict";

// Núcleo del Txalometroa: lectura del export, limpieza, análisis y bloque
// público. Lo comparten la app (app/txalometroa.src.html) y la réplica de la
// web (replica/replica.src.html); construir.py lo incrusta en las dos.

const PREG = ["GAL1", "GAL2", "GAL3", "GAL4", "GAL5", "GAL6", "GAL7"];

// ---------------------------------------------------------------- Lectura

const BOM = String.fromCharCode(0xFEFF);

function parsearTexto(texto) {
  if (texto.startsWith(BOM)) texto = texto.slice(1);
  const primera = texto.split(/\r?\n/, 1)[0];
  const delim = primera.includes("\t") ? "\t" : primera.includes(";") ? ";" : ",";
  const filas = [];
  let fila = [], campo = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') comillas = false;
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === delim) { fila.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      fila.push(campo); filas.push(fila); fila = []; campo = "";
    } else campo += c;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter(f => f.some(v => String(v).trim() !== ""));
}

function aObjetos(matriz) {
  const cab = matriz[0].map(h => String(h).trim().toUpperCase());
  const faltan = ["PRODUKZIOA", "NOIZ", ...PREG].filter(c => !cab.includes(c));
  if (faltan.length) throw new Error(`Al fichero le faltan columnas: ${faltan.join(", ")}. ¿Es el export del Txalometroa?`);
  return matriz.slice(1).map(f => Object.fromEntries(cab.map((h, i) => [h, f[i] ?? ""])));
}

function cargarSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => ko(new Error("No se pudo cargar el lector de Excel. Guarda el fichero como CSV o texto con tabulaciones."));
    document.head.append(s);
  });
}

async function leerFichero(buf) {
  const b = new Uint8Array(buf.slice(0, 4));
  const binario = (b[0] === 0xD0 && b[1] === 0xCF) || (b[0] === 0x50 && b[1] === 0x4B);
  if (binario) {
    await cargarSheetJS();
    const libro = XLSX.read(buf, { type: "array", cellDates: true });
    const hoja = libro.Sheets[libro.SheetNames[0]];
    const filas = aObjetos(XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: "" }));
    // Las fechas de Excel llegan como Date: se pasan a texto local para poder guardarlas.
    for (const f of filas) if (f.NOIZ instanceof Date) {
      const d = f.NOIZ;
      f.NOIZ = `${d.getFullYear()}-${dd(d.getMonth() + 1)}-${dd(d.getDate())} ${dd(d.getHours())}:${dd(d.getMinutes())}:${dd(d.getSeconds())}`;
    }
    return filas;
  }
  let texto;
  try { texto = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { texto = new TextDecoder("windows-1252").decode(buf); }
  return aObjetos(parsearTexto(texto));
}

function parsearFecha(v) {
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0));
  return null;
}

// ---------------------------------------------------------------- Limpieza y análisis

const slug = s => s.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const media = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
const pct = (parte, total) => total ? Math.round(100 * parte / total) : 0;
const r2 = x => Math.round(x * 100) / 100;

function limpiar(filas, cfg) {
  const alias = {};
  for (const [id, o] of Object.entries(cfg.obras)) for (const n of o.alias) alias[n.trim().toLowerCase()] = id;
  const validas = [], sinMapear = new Set(), ultima = {};
  const descartes = { vacias: 0, sin_obra: 0, duplicadas: 0, sin_fecha: 0 };

  for (const f of filas) {
    const notas = {};
    for (const g of PREG) { const v = parseInt(f[g], 10) || 0; notas[g] = v >= 1 && v <= 10 ? v : null; }
    if (PREG.every(g => notas[g] === null)) { descartes.vacias++; continue; }
    const nombre = String(f.PRODUKZIOA ?? "").trim();
    if (!nombre) { descartes.sin_obra++; continue; }
    const cuando = parsearFecha(f.NOIZ);
    if (!cuando) { descartes.sin_fecha++; continue; }
    let obra = alias[nombre.toLowerCase()];
    if (!obra) { obra = slug(nombre); sinMapear.add(nombre); }

    const prev = ultima[obra];
    const firma = PREG.map(g => notas[g]).join(",");
    if (prev && prev.firma === firma && (cuando - prev.cuando) / 1000 <= cfg.limpieza.segundos_duplicado) { descartes.duplicadas++; continue; }

    const deObra = cfg.nota_obra.map(g => notas[g]).filter(v => v !== null);
    const r = { id: f.ID, obra, nombre, idioma: String(f.HIZKUNTZA ?? "").trim(), cuando, notas, firma,
                media: deObra.length ? media(deObra) : null };
    validas.push(r); ultima[obra] = r;
  }
  validas.sort((a, b) => a.cuando - b.cuando);

  // Funciones: bloques de respuestas de una obra sin huecos de más de N horas.
  const hueco = cfg.limpieza.horas_entre_funciones * 3600e3, finPorObra = {};
  for (const r of validas) {
    const act = finPorObra[r.obra];
    if (!act || r.cuando - act.fin > hueco) finPorObra[r.obra] = { id: `${r.obra}-${+r.cuando}`, fin: r.cuando };
    finPorObra[r.obra].fin = r.cuando;
    r.funcion = finPorObra[r.obra].id;
  }
  return { validas, descartes, sinMapear: [...sinMapear].sort() };
}

function metricas(rs, cfg) {
  const ms = rs.map(r => r.media).filter(m => m !== null);
  const rec = rs.map(r => r.notas[cfg.pregunta_recomendacion]).filter(v => v !== null);
  const prom = pct(rec.filter(v => v >= 9).length, rec.length), detr = pct(rec.filter(v => v <= 6).length, rec.length);
  return {
    n: rs.length,
    nota: ms.length ? r2(media(ms)) : null,
    pct_muy_satisfechos: pct(ms.filter(m => m >= 9).length, ms.length),
    pct_insatisfechos: pct(ms.filter(m => m <= 6).length, ms.length),
    pct_recomendaria: prom,
    indice_recomendacion: rec.length ? prom - detr : null,
  };
}

function metricasPregunta(rs, g) {
  const vs = rs.map(r => r.notas[g]).filter(v => v !== null);
  return { n: vs.length, media: vs.length ? r2(media(vs)) : null,
           pct_10: pct(vs.filter(v => v === 10).length, vs.length), pct_bajo: pct(vs.filter(v => v <= 6).length, vs.length) };
}

function analizar(filas, cfg) {
  const { validas, descartes, sinMapear } = limpiar(filas, cfg);
  if (!validas.length) throw new Error("No hay ninguna respuesta válida en el fichero.");
  const ids = [...new Set(validas.map(r => r.obra))];
  const obras = ids.map(id => {
    const rs = validas.filter(r => r.obra === id);
    const info = cfg.obras[id] || { eu: rs[0].nombre, es: rs[0].nombre };
    const funciones = [...new Set(rs.map(r => r.funcion))].map(fid => {
      const fr = rs.filter(r => r.funcion === fid);
      return { id: fid, inicio: fr[0].cuando, fin: fr.at(-1).cuando, fiable: fr.length >= cfg.limpieza.min_respuestas_funcion, ...metricas(fr, cfg) };
    });
    return { id, eu: info.eu, es: info.es, imagen: info.imagen || "", primera: rs[0].cuando, ultima: rs.at(-1).cuando, ...metricas(rs, cfg),
             preguntas: Object.fromEntries(PREG.map(g => [g, metricasPregunta(rs, g)])), funciones };
  }).sort((a, b) => b.n - a.n);

  const res = { generado: new Date(), filas: filas.length, validas, descartes, sinMapear, obras,
                desde: validas[0].cuando, hasta: validas.at(-1).cuando, global: metricas(validas, cfg) };
  res.conclusiones = conclusiones(res, cfg);
  return res;
}

function conclusiones(res, cfg) {
  const t = [], et = g => cfg.preguntas[g].es;
  for (const o of res.obras) {
    if (o.n < cfg.publicacion.min_respuestas_obra) { t.push(`«${o.es}» solo tiene ${o.n} respuestas: aún no es representativo.`); continue; }
    const ms = cfg.nota_obra.filter(g => o.preguntas[g].media !== null).map(g => [g, o.preguntas[g].media]);
    const floja = ms.reduce((a, b) => b[1] < a[1] ? b : a), fuerte = ms.reduce((a, b) => b[1] > a[1] ? b : a);
    const ind = o.indice_recomendacion;
    t.push(`«${o.es}»: ${fmt(o.nota)} de nota con ${o.n} respuestas; el ${o.pct_recomendaria}% la recomendaría (índice de recomendación ${ind >= 0 ? "+" : ""}${ind}). ` +
           `Lo mejor valorado: ${et(fuerte[0]).toLowerCase()} (${fmt(fuerte[1])}); lo más flojo: ${et(floja[0]).toLowerCase()} (${fmt(floja[1])}).`);
    const fiables = o.funciones.filter(f => f.fiable && f.nota !== null);
    if (fiables.length >= 3) {
      const peor = fiables.reduce((a, b) => b.nota < a.nota ? b : a);
      if (o.nota - peor.nota >= 0.5)
        t.push(`«${o.es}»: la función del ${fecha(peor.inicio)} quedó por debajo (${fmt(peor.nota)} con ${peor.n} respuestas). Vale la pena revisar qué pasó ese día.`);
    }
  }
  const bloque = b => PREG.filter(g => cfg.preguntas[g].bloque === b).map(g => [g, metricasPregunta(res.validas, g)]);
  const fid = bloque("publico");
  if (fid.length) t.push("Fidelidad: " + fid.map(([g, m]) => `«${et(g)}» ${fmt(m.media)} (${m.pct_bajo}% da 6 o menos)`).join("; ") + ". Es lo que indica si el público volverá.");
  for (const [g, m] of bloque("localidad"))
    t.push(`«${et(g)}» saca ${fmt(m.media)}, pero no habla de la obra sino del municipio: no entra en la nota de las obras. El formulario no guarda la localidad, así que solo se puede cruzar por fecha de función.`);
  const d = res.descartes;
  if (d.vacias) t.push(`${d.vacias} envíos llegaron con todos los deslizadores a 0 (se pulsó TXALOTU sin mover nada). El formulario debería exigir al menos una respuesta.`);
  if (d.sin_obra) t.push(`${d.sin_obra} respuestas llegaron sin obra y no se pueden usar; el formulario no debería guardar un envío si no sabe a qué obra pertenece.`);
  if (d.duplicadas) t.push(`${d.duplicadas} envíos eran duplicados (mismas notas en pocos segundos, típico doble clic o recarga). Se evita desactivando el botón tras enviar.`);
  const todas = res.validas.flatMap(r => PREG.map(g => r.notas[g])).filter(v => v !== null);
  const p10 = pct(todas.filter(v => v === 10).length, todas.length);
  if (p10 >= 50) t.push(`El ${p10}% de las notas son un 10: la escala se satura y las medias se parecen mucho. Por eso conviene mirar también el % de notas bajas (≤6) y el % que la recomendaría.`);
  if (res.sinMapear.length) t.push(`Hay nombres de obra que no están en Ajustes: ${res.sinMapear.join(", ")}. Añádelos para unir sus versiones eu/es.`);
  return t;
}

// ---------------------------------------------------------------- Formato

const fmt = (x, d = 1) => x === null || x === undefined ? "–" : x.toFixed(d).replace(".", ",");
const dd = n => String(n).padStart(2, "0");
const fecha = d => `${dd(d.getDate())}/${dd(d.getMonth() + 1)}/${d.getFullYear()}`;
const fechaHora = d => `${fecha(d)} ${dd(d.getHours())}:${dd(d.getMinutes())}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------- Bloque público (reseña)

const TXT_BLOQUE = {
  eu: { titulo: "Ikusleen iritzia", sub: "Txalometroan jasotako balorazioak, 1etik 10era",
        resp: n => `${n} balorazio`, pct: p => `%${p}k gomendatuko luke`, act: f => `Eguneratua: ${f}` },
  es: { titulo: "La opinión del público", sub: "Valoraciones recogidas en el Txalometro, del 1 al 10",
        resp: n => `${n} valoraciones`, pct: p => `El ${p}% la recomendaría`, act: f => `Actualizado: ${f}` },
};

const CSS_BLOQUE = `
.txalo-emaitzak { --txalo-gorria: #ff3c42; --txalo-testua: #595b60; margin: 40px 0; color: var(--txalo-testua); }
.txalo-emaitzak * { box-sizing: border-box; }
.txalo-emaitzak .txalo-izenburua { font-weight: 300; font-size: 2.2rem; letter-spacing: .03em; text-align: center; margin: 0; color: var(--txalo-testua); }
.txalo-emaitzak .txalo-azpi { text-align: center; font-size: .95rem; margin: 6px 0 28px; opacity: .8; }
.txalo-emaitzak .txalo-lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px; }
.txalo-emaitzak .txalo-obra { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 28px rgba(30, 20, 20, .10); display: flex; flex-direction: column; }
.txalo-emaitzak .txalo-irudia { position: relative; aspect-ratio: 3 / 2; background: #4d3733; }

// Genera la reseña pública como HTML estático (sin JavaScript), para pegar en
// un bloque «HTML personalizado» de WordPress. opts.obras limita a esas obras.
function bloqueWordpress(res, cfg, lang, opts = {}) {
  const t = TXT_BLOQUE[lang], pub = cfg.publicacion;
  const preguntas = pub.preguntas_publicas || cfg.nota_obra;
  const obras = res.obras.filter(o => o.n >= pub.min_respuestas_obra && o.nota !== null && (!opts.obras || opts.obras.includes(o.id)));
  const tarjetas = obras.map(o => {
    const img = o.imagen ? `<img src="${esc(o.imagen)}" alt="${esc(o[lang])}" loading="lazy">` : "";
    const barras = preguntas.filter(g => o.preguntas[g].media !== null).map(g => {
      const m = o.preguntas[g].media;
      return `<li><span>${esc(cfg.preguntas[g][lang])}</span><b>${fmt(m)}</b><span class="txalo-barra"><i style="width:${Math.round(m * 10)}%"></i></span></li>`;
    }).join("");
    return `<article class="txalo-obra">
<div class="txalo-irudia">${img}<h4 class="txalo-izena">${esc(o[lang])}</h4>
<div class="txalo-nota">${svgLogoLiquido(o.nota)}<span>${fmt(o.nota)}<small>/ 10</small></span></div></div>
<div class="txalo-gorputza"><div class="txalo-datuak"><span class="txalo-txip">${t.resp(o.n)}</span><span class="txalo-txip gorria">${t.pct(o.pct_recomendaria)}</span></div>
<ul class="txalo-barrak">${barras}</ul></div>
</article>`;
  }).join("\n");
  const cabecera = opts.sinCabecera ? "" : `<h3 class="txalo-izenburua">${t.titulo}</h3>\n<p class="txalo-azpi">${t.sub}</p>\n`;
  return `<!-- Txalometroa · generado el ${fechaHora(res.generado)}. No lo edites a mano: vuelve a generarlo y pégalo entero. -->
<style>${CSS_BLOQUE}
</style>
<div class="txalo-emaitzak" lang="${lang}">
${cabecera}<div class="txalo-lista">
${tarjetas}
</div>
<p class="txalo-pie">${t.act(fecha(res.hasta))}</p>
</div>`;
}

// ---------------------------------------------------------------- Alta de obras desde el export

// Por cada nombre de obra del export: respuestas, idioma predominante y días con respuestas.
function infoNombres(filas) {
  const info = {};
  for (const f of filas) {
    const n = String(f.PRODUKZIOA ?? "").trim(); if (!n) continue;
    const i = info[n] ||= { n: 0, eu: 0, es: 0, dias: new Set() };
    i.n++;
    const h = String(f.HIZKUNTZA ?? "").trim().toLowerCase();
    if (h === "eu" || h === "es") i[h]++;
    const d = parsearFecha(f.NOIZ); if (d) i.dias.add(fecha(d));
  }
  for (const i of Object.values(info)) i.idioma = i.eu > i.es ? "eu" : "es";
  return info;
}

// Si dos nombres en idiomas distintos reciben respuestas los mismos días, lo más
// probable es que sean la misma obra (versión eu y versión es). Puntuación: parte
// de los días del nombre con menos días que coinciden con el otro. Se empareja de
// mayor a menor puntuación, cada nombre una sola vez. Devuelve { i: j } con j < i.
function emparejar(nombres, info) {
  const pares = [];
  for (let i = 0; i < nombres.length; i++) for (let j = 0; j < i; j++) {
    const a = info[nombres[i]], b = info[nombres[j]];
    if (!a || !b || a.idioma === b.idioma) continue;
    const comunes = [...a.dias].filter(d => b.dias.has(d)).length;
    const p = comunes / Math.min(a.dias.size, b.dias.size);
    if (comunes && p >= 0.35) pares.push({ i, j, p });
  }
  const usado = new Set(), res = {};
  for (const { i, j } of pares.sort((x, y) => y.p - x.p)) {
    if (usado.has(i) || usado.has(j)) continue;
    usado.add(i); usado.add(j); res[i] = j;
  }
  return res;
}

// Tabla para decidir, por cada nombre nuevo del export, si es una obra nueva o la
// misma que otra. Los controles llevan id nueva-<i> y foto-<i>.
function htmlTablaObrasNuevas(nombres, cfg, filas) {
  const info = infoNombres(filas), parejas = emparejar(nombres, info);
  const filasHtml = nombres.map((n, i) => {
    const sug = parejas[i] ?? null;
    const opciones = [`<option value="nueva">Una obra nueva</option>`,
      ...Object.entries(cfg.obras).map(([id, o]) => `<option value="id:${esc(id)}">La misma que «${esc(o.es)}»</option>`),
      ...nombres.slice(0, i).map((m, j) => `<option value="n:${j}" ${j === sug ? "selected" : ""}>La misma que «${esc(m)}»${j === sug ? " (sugerido)" : ""}</option>`)];
    return `<tr><td><b>${esc(n)}</b></td><td class="num">${info[n]?.n ?? 0}</td><td>${info[n]?.idioma ?? "–"}</td>
      <td><select id="nueva-${i}" aria-label="Qué es «${esc(n)}»">${opciones.join("")}</select>${sug !== null ? `<span class="sugerido">Mismas fechas que «${esc(nombres[sug])}»</span>` : ""}</td>
      <td><input id="foto-${i}" type="url" aria-label="Foto de «${esc(n)}»" placeholder="https://…/foto.jpg (opcional)"></td></tr>`;
  }).join("");
  return `<table class="nuevas"><tr><th>Nombre en el export</th><th>Respuestas</th><th>Idioma</th><th>Es…</th><th>Foto</th></tr>${filasHtml}</table>`;
}

// Lee las decisiones de la tabla anterior y crea o amplía las obras en cfg.
function aplicarObrasNuevas(cfg, nombres, filas) {
  const info = infoNombres(filas);
  const valor = i => document.getElementById(`nueva-${i}`).value;
  const foto = i => document.getElementById(`foto-${i}`).value.trim();
  const idDe = {};
  nombres.forEach((n, i) => {
    if (valor(i) !== "nueva") return;
    let id = slug(n) || "obra", k = 2;
    while (cfg.obras[id]) id = `${slug(n) || "obra"}-${k++}`;
    cfg.obras[id] = { eu: n, es: n, alias: [n], imagen: foto(i) };
    idDe[i] = id;
  });
  const destino = i => { const v = valor(i); return v === "nueva" ? idDe[i] : v.startsWith("id:") ? v.slice(3) : destino(+v.slice(2)); };
  nombres.forEach((n, i) => {
    if (valor(i) === "nueva") return;
    const o = cfg.obras[destino(i)];
    if (!o.alias.includes(n)) o.alias.push(n);
    o[info[n]?.idioma ?? "es"] = n;
    if (!o.imagen && foto(i)) o.imagen = foto(i);
  });
  return cfg;
}

// Máscara de teatro. k: -1 (drama) … 1 (comedia). relleno: 0–1 (parte roja, de izquierda a derecha).
let idMascara = 0;
function svgMascara(k, relleno = 1, opts = {}) {
  const id = `msk${++idMascara}`;
  const sube = k;                       // >0 sonríe, <0 llora
  // Boca: comisuras arriba (comedia) o abajo (drama); la abertura se agranda en los extremos.
  const cy = 76 - 7 * sube, abre = 6 + 8 * Math.abs(k);
  const boca = sube >= 0
    ? `M28 ${cy} Q50 ${cy + 4 + abre * 1.6} 72 ${cy} Q50 ${cy + 6} 28 ${cy} Z`
    : `M28 ${cy} Q50 ${cy - 6 - abre * 1.3} 72 ${cy} Q50 ${cy - 2} 28 ${cy} Z`;
  // Ojos: media luna feliz o caída triste.
  const ojo = (x, lado) => {
    const caida = -sube * 5 * lado;      // la esquina exterior cae en drama
    return sube >= 0
      ? `M${x - 10} ${44 + 2} Q${x} ${32 + 2 - 6 * sube} ${x + 10} ${44 + 2} Q${x} ${40 + 2} ${x - 10} ${44 + 2} Z`
      : `M${x - 10} ${42 + (lado < 0 ? -caida : 0)} Q${x} ${50} ${x + 10} ${42 + (lado > 0 ? caida : 0)} Q${x} ${34} ${x - 10} ${42 + (lado < 0 ? -caida : 0)} Z`;
  };
  // Cejas: arqueadas (comedia) o con la parte interior levantada (drama).
  const ceja = (x, lado) => {
    const int = x + (lado < 0 ? 9 : -9), ext = x + (lado < 0 ? -11 : 11);
    const yInt = 27 - Math.max(0, -sube) * 7, yExt = 27 + Math.max(0, -sube) * 3;
    return `M${ext} ${yExt} Q${x} ${21 - 3 * Math.max(0, sube)} ${int} ${yInt}`;
  };
  const cara = "M50 4 C78 4 95 14 95 40 C95 70 80 101 50 106 C20 101 5 70 5 40 C5 14 22 4 50 4 Z";
  const agujeros = `${ojo(32, -1)} ${ojo(68, 1)} ${boca}`;
  const capa = (fondo, borde, sombra) => `
    <path d="${cara} ${agujeros}" fill-rule="evenodd" fill="${fondo}" stroke="${borde}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${ceja(32, -1)} ${ceja(68, 1)}" fill="none" stroke="${sombra}" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg class="mascara" viewBox="-2 0 104 110" aria-hidden="true">
  <defs>
    <linearGradient id="${id}-r" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#ef5a4f"/><stop offset=".55" stop-color="#d0322a"/><stop offset="1" stop-color="#9f1d17"/></linearGradient>
    <linearGradient id="${id}-c" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#ecd29b"/></linearGradient>
    <clipPath id="${id}-m"><rect x="-2" y="0" width="${(104 * relleno).toFixed(1)}" height="110"/></clipPath>
  </defs>
  ${opts.vacia === false ? "" : capa(`url(#${id}-c)`, "#cfae6c", "#b8955a")}
  <g clip-path="url(#${id}-m)">${capa(`url(#${id}-r)`, "#7d1712", "#7d1712")}
    <path d="M30 14 C40 9 60 9 70 14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4" stroke-linecap="round"/></g>
</svg>`;
}

// Como en la web: las obras estrenadas más recientemente, primero.
function obrasOrdenadas() {
  const ids = Object.keys(G.cfg.obras);
  const estrenos = G.estrenos.filter(id => ids.includes(id)).reverse();
  const resto = [...ORDEN_HIKA.filter(id => ids.includes(id)), ...ids.filter(id => !ORDEN_HIKA.includes(id))].filter(id => !estrenos.includes(id));

const ACCIONES = {
  vaciar() { G.fichero = null; G.vaciado = true; return "Datos vaciados. Carga el export de nuevo o añade obras."; },
  cero() {
    G.fichero = null; G.vaciado = true; G.cfg.obras = {}; G.votos = []; G.pegado = { votos: 0, cuando: null }; G.estrenos = [];
    return "Todo vacío. Añade obras o carga el export para empezar.";

  serie() { const modo = G.modo; G = estadoDeSerie(); G.modo = modo; return "Réplica restaurada como al principio."; },
  votos() { G.votos = []; G.pegado = { votos: 0, cuando: null }; return "Votos de prueba borrados."; },
  quitar(id) {
    const o = G.cfg.obras[id], nombres = new Set(o.alias.map(a => a.toLowerCase()));

// Reduce la foto a 960 px de lado como máximo para que quepa en el navegador.
function leerFoto(file) {
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 960 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("Ese fichero no es una imagen que se pueda abrir.")); };
    img.src = url;
  });
}

function publicarObra() {
  const eu = document.getElementById("obra-eu").value.trim(), es = document.getElementById("obra-es").value.trim() || eu;
  const err = document.getElementById("obra-errorea");
  if (!eu) { err.textContent = "Escribe al menos el título en euskera."; return; }
  const existentes = new Set(Object.values(G.cfg.obras).flatMap(o => o.alias.map(a => a.toLowerCase())));
  if (existentes.has(eu.toLowerCase()) || existentes.has(es.toLowerCase())) { err.textContent = "Ya hay una obra con ese título."; return; }
  let id = slug(eu) || "obra", k = 2;
  while (G.cfg.obras[id]) id = `${slug(eu) || "obra"}-${k++}`;
  G.cfg.obras[id] = { eu, es, alias: [...new Set([eu, es])], imagen: estado.foto };
  G.estrenos.push(id);
  if (!guardar()) {
    // Si la foto subida no cabe en el navegador, se guarda la obra sin ella.
    G.cfg.obras[id].imagen = ""; guardar();
    estado.aviso = `Publicada «${eu}», pero la foto es demasiado grande para guardarla en el navegador.`;
  } else estado.aviso = `Publicada «${eu}». Ya se puede votar en el Txalometroa.`;
  estado.destacar = id;
  cerrarModala(); irA("zerrenda");
  document.getElementById(`txartela-${id}`)?.scrollIntoView({ block: "center" });
  setTimeout(() => { estado.destacar = null; }, 3500);
}

function enviar(form) {
  const t = T[estado.lang], id = form.dataset.obra;
  const valores = Object.fromEntries(PREG.map(g => [g, +form.elements[g].value]));
  const oharra = document.getElementById("oharra");

  // Evita el doble envío: el botón se bloquea en cuanto se pulsa.

  guardar();
  setTimeout(() => { irA("eskerrik", { obra: id, antes }); konfetia(); }, 450);

// Pequeña celebración al aplaudir, con los colores de Hika.
function konfetia() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("konfetia"), ctx = c.getContext("2d");
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const col = ["#ff3c42", "#231f20", "#ffd34d", "#c8442c", "#ffffff"];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
    r: Math.random() * 6 + 4, c: col[Math.floor(Math.random() * col.length)], a: Math.random() * Math.PI, va: (Math.random() - .5) * .3 }));
  let frames = 0;
  (function paso() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.strokeStyle = "rgba(0,0,0,.15)";
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.strokeRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    }
    if (++frames < 110) requestAnimationFrame(paso); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })();
}

// ---------------------------------------------------------------- Eventos

document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]");
  if (l) { estado.lang = l.dataset.lang; pintar(); return; }
  const tx = e.target.closest("[data-txalotu]");
  if (tx) { e.preventDefault(); irA("galdetegia", { obra: tx.dataset.txalotu }); return; }
  const j = e.target.closest("[data-joan]");
  if (j) { e.preventDefault(); irA(j.dataset.joan); return; }
  if (e.target.closest("#menu-botoia")) {
    const m = document.getElementById("menua"), abierto = m.classList.toggle("itxita") === false;
    e.target.closest("#menu-botoia").setAttribute("aria-expanded", abierto); return;
  }
  if (e.target.closest("#panel-toggle")) { estado.panelAbierto = !estado.panelAbierto; pintarPanel(); return; }

  // Acciones que borran: el primer clic avisa y el segundo (en 4 s) ejecuta.
  const acc = e.target.closest("[data-accion]");
  if (acc) {
    const clave = acc.dataset.accion;
    clearTimeout(estado.armado?.timer);
    if (estado.armado?.id === clave) {
      const [id, arg] = clave.split(":");
      estado.armado = null; estado.aviso = ACCIONES[id](arg); guardar(); cerrarModala(); irA("zerrenda");
    } else {
      estado.armado = { id: clave, timer: setTimeout(() => { estado.armado = null; pintarPanel(); }, 4000) };
      pintarPanel();
    }
    return;
  }
  if (e.target.id === "anadir-obra") { abrirNuevaObra(); return; }
  if (e.target.id === "cargar") { document.getElementById("input-fichero").click(); return; }
  if (e.target.id === "configurar") { abrirObrasNuevas(); return; }
  if (e.target.id === "guardar-obras") {
    const m = document.getElementById("modala");
    aplicarObrasNuevas(G.cfg, JSON.parse(m.dataset.nombres), datosExport().filas);
    guardar(); cerrarModala(); estado.aviso = "Obras guardadas."; irA("zerrenda"); return;
  }
  if (e.target.id === "cerrar-modala" || e.target.id === "modala") { cerrarModala(); return; }
  if (e.target.id === "pegar") {
    G.pegado = { votos: G.votos.length, cuando: new Date().toISOString() }; guardar();
    pintar(); if (vistaActual.nombre === "zerrenda") document.getElementById("emaitzak").scrollIntoView({ block: "start" }); return;
  }
});

document.addEventListener("change", async e => {
  if (e.target.name === "modo") { G.modo = e.target.value; guardar(); pintar(); }
  if (e.target.id === "marcar") { estado.marcarBloque = e.target.checked; pintar(); if (estado.marcarBloque) document.getElementById("emaitzak")?.scrollIntoView({ block: "center" }); }
  if (e.target.id === "min-publicar") { G.cfg.publicacion.min_respuestas_obra = Math.max(1, parseInt(e.target.value, 10) || 1); guardar(); pintar(); }
  if (e.target.id === "input-fichero") { const f = e.target.files[0]; e.target.value = ""; if (f) abrirFichero(f); }
  if (e.target.id === "obra-foto-fitxategia") {
    const f = e.target.files[0]; if (!f) return;
    try { pintarAurrebista(await leerFoto(f)); document.getElementById("obra-foto-url").value = ""; }
    catch (err) { document.getElementById("obra-errorea").textContent = err.message; }
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "obra-foto-url") { pintarAurrebista(e.target.value.trim()); return; }
  if (e.target.type !== "range") return;
  const v = +e.target.value, out = document.getElementById(`out-${e.target.id}`);
  e.target.style.setProperty("--bete", `${v * 10}%`);
  out.textContent = v; out.classList.toggle("jarrita", v > 0);
  const oharra = document.getElementById("oharra");
  if (oharra && oharra.classList.contains("errorea")) { oharra.textContent = ""; oharra.className = "oharra"; }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "form-obra") { publicarObra(); return; }
  enviar(e.target);
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("modala").hidden) cerrarModala(); });

// Arrastrar un export a la ventana lo carga (salvo con la ventana de añadir obra abierta).
const capa = document.getElementById("soltar");
let arrastres = 0;
const soltarExport = () => document.getElementById("modala").hidden;
window.addEventListener("dragenter", e => { if (soltarExport() && e.dataTransfer?.types.includes("Files")) { arrastres++; capa.hidden = false; } });
window.addEventListener("dragleave", () => { if (--arrastres <= 0) { arrastres = 0; capa.hidden = true; } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); arrastres = 0; capa.hidden = true; const f = e.dataTransfer.files[0]; if (f && soltarExport()) abrirFichero(f); });

// Un enlace o QR con #txalotu-<obra> abre directamente el formulario de esa obra.
const directo = location.hash.match(/^#txalotu-(.+)$/);
if (directo && G.cfg.obras[directo[1]]) pintar({ nombre: "galdetegia", obra: directo[1] });
else pintar();
</script>
</body>
</html>

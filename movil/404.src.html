<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Txalometroa · 404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
/* Error 404 / sin conexión: el telón se queda cerrado y por detrás asoma un cartel con el error.
   Netlify sirve esta página para cualquier dirección que no existe; el service worker, cuando no hay red ni copia. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d0d; }
__TELON_CSS__
.telon .curtain { background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.1) 22%, rgba(0,0,0,.1) 78%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(90deg, #4a0710 0px, #7d111c 22px, #b0222e 40px, #c9343f 48px, #9a1a25 60px, #5e0b15 80px); }
.telon .v .curtain { background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.1) 20%, rgba(0,0,0,.1) 80%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(90deg, #4a0710 0px, #7d111c 16px, #b0222e 30px, #c9343f 36px, #9a1a25 45px, #5e0b15 60px); }
.telon .floor { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.6) 100%), repeating-linear-gradient(90deg, #3a2414 0 118px, #2a190e 118px 120px); }
.telon .v .floor { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.6) 100%), repeating-linear-gradient(90deg, #3a2414 0 78px, #2a190e 78px 80px); }
/* El telón derecho tapa el cartel y se abomba cuando lo empujan. */
.telon .curtain.right { z-index: 4; box-shadow: inset 26px 0 34px rgba(0,0,0,.65), -10px 0 18px rgba(0,0,0,.45); animation: errEmpujaH 9s ease-in-out infinite; }
.telon .v .curtain.right { box-shadow: inset 20px 0 26px rgba(0,0,0,.65), -8px 0 14px rgba(0,0,0,.45); animation-name: errEmpujaV; }
@keyframes errEmpujaH { 0%, 7% { transform: scaleX(1); } 12% { transform: scaleX(.975); } 20%, 86% { transform: scaleX(.99); } 92% { transform: scaleX(.97); } 100% { transform: scaleX(1); } }
@keyframes errEmpujaV { 0%, 7% { transform: scaleX(1); } 12% { transform: scaleX(.96); } 20%, 86% { transform: scaleX(.985); } 92% { transform: scaleX(.96); } 100% { transform: scaleX(1); } }
/* Luz que parpadea */
.telon .dim { position: absolute; inset: 0; z-index: 5; pointer-events: none; animation: errParpadeo 4s steps(1, end) infinite;
  background: radial-gradient(ellipse 520px 460px at 46% 48%, rgba(255,200,140,.16), rgba(0,0,0,.45) 75%); }
.telon .v .dim { background: radial-gradient(ellipse 240px 380px at 45% 42%, rgba(255,200,140,.16), rgba(0,0,0,.45) 75%); }
@keyframes errParpadeo { 0%, 100% { opacity: 1; } 8% { opacity: .55; } 9% { opacity: 1; } 11% { opacity: .7; } 12% { opacity: 1; } 63% { opacity: .6; } 64% { opacity: 1; } }
/* El cartel asoma, se balancea y se vuelve a esconder (9 s). */
.telon .peek { position: absolute; left: calc(50% - 400px); top: calc(200px + var(--dy) / 2); width: 760px; height: 280px; z-index: 3; animation: errAsomaH 9s infinite; }
.telon .v .peek { left: calc(50% - 188px); top: calc(250px + var(--dy) / 2); width: 560px; height: 220px; animation-name: errAsomaV; }
@keyframes errAsomaH { 0%, 8% { transform: translateX(420px); animation-timing-function: cubic-bezier(.3,1.45,.55,1); } 22%, 86% { transform: translateX(0); animation-timing-function: cubic-bezier(.6,0,.8,.4); } 97%, 100% { transform: translateX(420px); } }
@keyframes errAsomaV { 0%, 8% { transform: translateX(200px); animation-timing-function: cubic-bezier(.3,1.45,.55,1); } 22%, 86% { transform: translateX(0); animation-timing-function: cubic-bezier(.6,0,.8,.4); } 97%, 100% { transform: translateX(200px); } }
.telon .swing { position: absolute; inset: 0; transform-origin: 400px 120px; animation: errBalanceo 2.6s ease-in-out infinite alternate; }
.telon .v .swing { transform-origin: 165px 62px; }
@keyframes errBalanceo { 0% { transform: rotate(-2.5deg); } 100% { transform: rotate(2deg); } }
.telon .manga { position: absolute; left: 440px; top: 94px; width: 340px; height: 54px; background: repeating-linear-gradient(90deg, #161616 0 20px, #ece6da 20px 40px); box-shadow: inset 0 -10px 14px rgba(0,0,0,.35); }
.telon .v .manga { left: 205px; top: 46px; height: 30px; background: repeating-linear-gradient(90deg, #161616 0 14px, #ece6da 14px 28px); box-shadow: inset 0 -7px 10px rgba(0,0,0,.35); }
.telon .cartel { position: absolute; left: 0; top: 0; width: 380px; height: 244px; box-sizing: border-box; border: 12px solid #6b4423; border-radius: 6px; background: #f3e6c8;
  box-shadow: 0 18px 36px rgba(0,0,0,.6), inset 0 0 0 2px #8a5a30; transform: rotate(-3deg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.telon .v .cartel { width: 172px; height: 124px; border-width: 7px; border-radius: 5px; box-shadow: 0 14px 28px rgba(0,0,0,.6), inset 0 0 0 2px #8a5a30; }
.telon .cartel .etiqueta { font-size: 14px; font-weight: 600; letter-spacing: 8px; color: #5e0b15; text-transform: uppercase; }
.telon .cartel .codigo { font: 800 104px/.95 'Playfair Display', Georgia, serif; color: #8e1622; }
.telon .cartel .titulo { font: 600 24px/1.15 'Playfair Display', Georgia, serif; color: #1a1a1a; padding: 0 14px; }
.telon .v .cartel .etiqueta { font-size: 9px; letter-spacing: 4px; }
.telon .v .cartel .codigo { font-size: 50px; }
.telon .v .cartel .titulo { font-size: 14px; padding: 0 8px; }
.telon .nail { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d9d2c2, #6b6355); }
.telon .v .nail { width: 8px; height: 8px; }
.telon .nail:nth-child(1) { left: 8px; top: 8px; } .telon .nail:nth-child(2) { right: 8px; top: 8px; }
.telon .nail:nth-child(3) { left: 8px; bottom: 8px; } .telon .nail:nth-child(4) { right: 8px; bottom: 8px; }
.telon .v .nail:nth-child(1) { left: 6px; top: 6px; } .telon .v .nail:nth-child(2) { right: 6px; top: 6px; }
.telon .v .nail:nth-child(3) { left: 6px; bottom: 6px; } .telon .v .nail:nth-child(4) { right: 6px; bottom: 6px; }
.telon .guante { position: absolute; left: 350px; top: 70px; width: 104px; height: 104px; }
.telon .v .guante { left: 152px; top: 30px; width: 60px; height: 60px; }
.telon .guante rect { stroke-width: 2.5; }
.telon .v .guante rect { stroke-width: 3; }
/* Mensaje y botón */
.telon .mensaje { position: absolute; left: 0; right: 0; top: calc(520px + var(--dy) / 2); z-index: 7; margin: 0; text-align: center; font-size: 15px; color: #f3dfb0; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
.telon .v .mensaje { left: 32px; right: 32px; top: calc(470px + var(--dy) / 2); line-height: 1.5; }
.telon .accion { position: absolute; left: 0; right: 0; top: calc(652px + var(--dy)); z-index: 7; display: flex; justify-content: center; }
.telon .v .accion { top: calc(768px + var(--dy)); }
.telon .retry { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 26px; border-radius: 999px; border: 2px solid #e8c36a; background: rgba(13,13,13,.6);
  color: #f6ecd6; font: 600 15px Inter, system-ui, sans-serif; letter-spacing: 1px; cursor: pointer; }
.telon .v .retry { padding: 0 24px; }
.telon .retry:hover, .telon .retry:focus-visible { background: #e8c36a; color: #1a0a0c; outline: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .telon .peek { animation: none; }
}
</style>
</head>
<body>
<main class="telon" id="telon"><div class="h"></div><div class="v"></div></main>
<script>
"use strict";
__TELON_JS__
(() => {
  const telon = document.getElementById("telon");
  let lang = (navigator.language || "eu").startsWith("es") ? "es" : "eu";
  try { lang = JSON.parse(localStorage.getItem("txalometroa-mugikorra")).lang || lang; } catch (e) { /* sin datos guardados */ }
  document.documentElement.lang = lang;
  // Sin red: «No hay conexión» y reintentar. Con red, la dirección no existe: volver al inicio.
  // EU: textos nuevos, pendientes de revisión por un hablante nativo.
  const sinRed = navigator.onLine === false;
  const T = {
    eu: sinRed ? { etiqueta: "Errorea", titulo: "Ez dago konexiorik", mensaje: "Emanaldia ezin izan da hasi. Egiaztatu konexioa eta saiatu berriro.", boton: "Saiatu berriro" }
               : { etiqueta: "Errorea", titulo: "Ez da orria aurkitu", mensaje: "Bilatzen duzun emanaldia ez dago kartelean.", boton: "Hasierara itzuli" },
    es: sinRed ? { etiqueta: "Error", titulo: "No hay conexión", mensaje: "La función no ha podido empezar. Revisa tu conexión e inténtalo de nuevo.", boton: "Reintentar" }
               : { etiqueta: "Error", titulo: "Página no encontrada", mensaje: "La función que buscas no está en cartel.", boton: "Volver al inicio" }
  }[lang];
  document.title = `Txalometroa · 404 · ${T.titulo}`;
  const guante = `<svg class="guante" viewBox="0 0 100 100" aria-hidden="true"><rect x="72" y="22" width="26" height="60" rx="6" fill="#e7e2d8" stroke="#2a2a2a"/><rect x="34" y="16" width="50" height="72" rx="22" fill="#fafafa" stroke="#2a2a2a"/><rect x="6" y="20" width="46" height="15" rx="7.5" fill="#fafafa" stroke="#2a2a2a"/><rect x="4" y="36" width="48" height="15" rx="7.5" fill="#fafafa" stroke="#2a2a2a"/><rect x="6" y="52" width="46" height="15" rx="7.5" fill="#fafafa" stroke="#2a2a2a"/><rect x="12" y="68" width="40" height="14" rx="7" fill="#fafafa" stroke="#2a2a2a"/><path d="M44 30 C50 34 52 40 50 46" fill="none" stroke="#c9c4ba" stroke-width="2" stroke-linecap="round"/></svg>`;
  const icono = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${sinRed ? `<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>` : `<path d="M15 18l-6-6 6-6"/>`}</svg>`;
  for (const o of ["h", "v"]) {
    telon.querySelector("." + o).innerHTML = `<div class="floor"></div><div class="curtain left"></div>
      <div class="peek" aria-hidden="true"><div class="swing"><div class="manga"></div>
        <div class="cartel"><span class="nail"></span><span class="nail"></span><span class="nail"></span><span class="nail"></span>
          <div class="etiqueta">${T.etiqueta}</div><div class="codigo">404</div><div class="titulo">${T.titulo}</div></div>${guante}</div></div>
      <div class="curtain right"></div><div class="dim"></div>
      <div class="valance"><span class="medal" role="img" aria-label="Hika Teatroa"></span><div class="marca"><b>TXALOMETROA</b><small>Hika Teatroa</small></div></div>
      <p class="mensaje">${T.mensaje}</p>
      <div class="accion"><button class="retry" type="button">${icono}<span>${T.boton}</span></button></div>`;
  }
  telonVigilar(telon);
  telon.addEventListener("click", e => {
    if (!e.target.closest(".retry")) return;
    if (sinRed) location.reload(); else location.href = "/";
  });
})();
</script>
</body>
</html>

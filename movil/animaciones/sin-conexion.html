<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0d0d}
.telon-wrap{position:fixed;inset:0;overflow:hidden;z-index:9999}
.h,.v{position:absolute;left:50%;top:50%;transform-origin:center center}
.h{width:1280px;height:720px}.v{width:390px;height:844px;display:none}
@media (orientation:portrait){.h{display:none}.v{display:block}}
.h .medal{display:block;border-radius:50%;background:#fff0c9;border:3px solid #c9973a;box-sizing:border-box;padding:7px;object-fit:contain;box-shadow:0 6px 18px rgba(0,0,0,.55)}
.h a{color:#e8c36a}
.h a:hover{color:#f6dc9a}
.h .curtain{position:absolute;top:0;height:640px;width:50%;
background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 22%,rgba(0,0,0,.1) 78%,rgba(0,0,0,.55) 100%),repeating-linear-gradient(90deg,#4a0710 0px,#7d111c 22px,#b0222e 40px,#c9343f 48px,#9a1a25 60px,#5e0b15 80px)}
.h .curtain::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:16px;background:repeating-linear-gradient(90deg,#e0b04a 0 3px,#8a6420 3px 6px);border-top:3px solid #c9973a}
.h .curtain.left{left:0;z-index:2;box-shadow:inset -26px 0 34px rgba(0,0,0,.65)}
.h .curtain.right{right:0;z-index:4;transform-origin:right top;box-shadow:inset 26px 0 34px rgba(0,0,0,.65),-10px 0 18px rgba(0,0,0,.45);animation:pushH 9s ease-in-out infinite}
@keyframes pushH{0%,7%{transform:scaleX(1)}12%{transform:scaleX(.975)}20%,86%{transform:scaleX(.99)}92%{transform:scaleX(.97)}100%{transform:scaleX(1)}}
.h .valance{position:absolute;top:0;left:0;right:0;height:96px;z-index:6;
background:linear-gradient(180deg,#3b050c 0%,#7d111c 55%,#5e0b15 100%);border-bottom:4px solid #c9973a;box-shadow:0 10px 24px rgba(0,0,0,.6)}
.h .valance::after{content:"";position:absolute;left:0;right:0;bottom:-26px;height:26px;
background:radial-gradient(circle at 40px -10px,#6d0e18 38px,transparent 39px) 0 0/80px 26px repeat-x}
.h .floor{position:absolute;left:0;right:0;top:640px;bottom:0;z-index:1;
background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 100%),repeating-linear-gradient(90deg,#3a2414 0 118px,#2a190e 118px 120px);border-top:2px solid #5a3a22}
.h .dim{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 520px 460px at 46% 48%,rgba(255,200,140,.16),rgba(0,0,0,.45) 75%);animation:flickerH 4s steps(1,end) infinite}
@keyframes flickerH{0%,100%{opacity:1}8%{opacity:.55}9%{opacity:1}11%{opacity:.7}12%{opacity:1}63%{opacity:.6}64%{opacity:1}}
.h .peek{position:absolute;left:240px;top:200px;width:760px;height:280px;z-index:3;animation:peekH 9s infinite}
@keyframes peekH{0%,8%{transform:translateX(420px);animation-timing-function:cubic-bezier(.3,1.45,.55,1)}22%,86%{transform:translateX(0);animation-timing-function:cubic-bezier(.6,0,.8,.4)}97%,100%{transform:translateX(420px)}}
.h .swing{position:absolute;inset:0;transform-origin:400px 120px;animation:swingH 2.6s ease-in-out infinite alternate}
@keyframes swingH{0%{transform:rotate(-2.5deg)}100%{transform:rotate(2deg)}}
.h .retry{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;border:2px solid #e8c36a;background:rgba(13,13,13,.6);color:#f6ecd6;font:600 15px Inter,system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
.h .retry:hover{background:#e8c36a;color:#1a0a0c}
.h .nail{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9d2c2,#6b6355)}
.v .medal{display:block;border-radius:50%;background:#fff0c9;border:3px solid #c9973a;box-sizing:border-box;padding:5px;object-fit:contain;box-shadow:0 6px 18px rgba(0,0,0,.55)}
.v a{color:#e8c36a}
.v a:hover{color:#f6dc9a}
.v .curtain{position:absolute;top:0;height:744px;width:50%;
background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 20%,rgba(0,0,0,.1) 80%,rgba(0,0,0,.55) 100%),repeating-linear-gradient(90deg,#4a0710 0px,#7d111c 16px,#b0222e 30px,#c9343f 36px,#9a1a25 45px,#5e0b15 60px)}
.v .curtain::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:13px;background:repeating-linear-gradient(90deg,#e0b04a 0 3px,#8a6420 3px 6px);border-top:3px solid #c9973a}
.v .curtain.left{left:0;z-index:2;box-shadow:inset -20px 0 26px rgba(0,0,0,.65)}
.v .curtain.right{right:0;z-index:4;transform-origin:right top;box-shadow:inset 20px 0 26px rgba(0,0,0,.65),-8px 0 14px rgba(0,0,0,.45);animation:pushV 9s ease-in-out infinite}
@keyframes pushV{0%,7%{transform:scaleX(1)}12%{transform:scaleX(.96)}20%,86%{transform:scaleX(.985)}92%{transform:scaleX(.96)}100%{transform:scaleX(1)}}
.v .valance{position:absolute;top:0;left:0;right:0;height:80px;z-index:6;
background:linear-gradient(180deg,#3b050c 0%,#7d111c 55%,#5e0b15 100%);border-bottom:3px solid #c9973a;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.v .valance::after{content:"";position:absolute;left:0;right:0;bottom:-20px;height:20px;
background:radial-gradient(circle at 30px -8px,#6d0e18 28px,transparent 29px) 0 0/60px 20px repeat-x}
.v .floor{position:absolute;left:0;right:0;top:744px;bottom:0;z-index:1;
background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 100%),repeating-linear-gradient(90deg,#3a2414 0 78px,#2a190e 78px 80px);border-top:2px solid #5a3a22}
.v .dim{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 240px 380px at 45% 42%,rgba(255,200,140,.16),rgba(0,0,0,.45) 75%);animation:flickerV 4s steps(1,end) infinite}
@keyframes flickerV{0%,100%{opacity:1}8%{opacity:.55}9%{opacity:1}11%{opacity:.7}12%{opacity:1}63%{opacity:.6}64%{opacity:1}}
.v .peek{position:absolute;left:7px;top:250px;width:560px;height:220px;z-index:3;animation:peekV 9s infinite}
@keyframes peekV{0%,8%{transform:translateX(200px);animation-timing-function:cubic-bezier(.3,1.45,.55,1)}22%,86%{transform:translateX(0);animation-timing-function:cubic-bezier(.6,0,.8,.4)}97%,100%{transform:translateX(200px)}}
.v .swing{position:absolute;inset:0;transform-origin:165px 62px;animation:swingV 2.6s ease-in-out infinite alternate}
@keyframes swingV{0%{transform:rotate(-2.5deg)}100%{transform:rotate(2deg)}}
.v .retry{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid #e8c36a;background:rgba(13,13,13,.6);color:#f6ecd6;font:600 15px Inter,system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
.v .retry:hover{background:#e8c36a;color:#1a0a0c}
.v .nail{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9d2c2,#6b6355)}
</style>

<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Txalometroa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Txalometroa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Raleway:wght@400;600;700&family=Playfair+Display:wght@600;800&family=Inter:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Diseño: fondo gris de las referencias con resplandores rojo y crema, letra pixelada
   para titulares y cifras, tarjetas crema con el logo de Hika. Una sola columna móvil. */
:root {
  --gris: #575757; --gris-2: #444; --gris-3: #2a2a2a; --negro: #0d0d0d;
  --rojo: #c80000; --rojo-logo: #c8361b; --rojo-vivo: #ff3c42;
  --crema: #fffdf0; --crema-logo: #fdeec7; --marino: #0b0a3a;
  --tinta: #fffdf0; --tinta-2: rgba(255, 253, 240, .74); --tinta-3: rgba(255, 253, 240, .5);
  --pixel: "Jersey 10", "Pixelify Sans", ui-monospace, monospace;
  --texto: Raleway, system-ui, -apple-system, "Segoe UI", sans-serif;
  --arriba: env(safe-area-inset-top, 0px); --abajo: env(safe-area-inset-bottom, 0px);
  --lado-i: max(16px, env(safe-area-inset-left, 0px)); --lado-d: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 60% at 0% 0%, rgba(200, 0, 0, .38), transparent 60%),
              radial-gradient(90% 50% at 100% 100%, rgba(253, 238, 199, .22), transparent 65%), var(--gris);
  background-attachment: fixed; color: var(--tinta); font: 16px/1.5 var(--texto);
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }
.pixel { font-family: var(--pixel); font-weight: 400; letter-spacing: .02em; line-height: .95; }
button:focus-visible, a:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--crema-logo); outline-offset: 2px; }

/* ---------- Cabecera y navegación */
header.goiburua { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: calc(var(--arriba) + 10px) var(--lado-d) 10px var(--lado-i); background: rgba(42, 42, 42, .82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.goiburua .marka { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.goiburua .marka .tile { width: 36px; height: 36px; border-radius: 9px; background: var(--crema-logo); padding: 4px; }
.goiburua .marka .tile svg { width: 100%; height: 100%; }
.goiburua .marka b { font: 400 30px var(--pixel); letter-spacing: .04em; }
.goiburua .ikono { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .08); }
.goiburua .ikono svg { width: 22px; height: 22px; }
.goiburua .instalatu { border: 1px solid var(--crema); background: var(--marino); padding: 7px 12px; font: 400 18px var(--pixel); text-decoration: underline; letter-spacing: .04em; }
main { padding: 8px var(--lado-d) calc(var(--abajo) + 96px) var(--lado-i); max-width: 620px; margin: 0 auto; }
nav.oina { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(var(--abajo) + 6px) max(8px, env(safe-area-inset-right, 0px));
  background: rgba(13, 13, 13, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255, 255, 255, .08); }
nav.oina button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--tinta-3); font: 400 14px var(--pixel); letter-spacing: .03em; min-width: 0; overflow-wrap: anywhere; }
nav.oina button svg { width: 26px; height: 26px; }
nav.oina button[aria-current="page"] { color: var(--tinta); }
nav.oina button[aria-current="page"] svg { color: var(--rojo-vivo); }

/* ---------- Piezas comunes */
h1.titulua { font: 400 44px/0.95 var(--pixel); margin: 18px 0 4px; letter-spacing: .02em; text-wrap: balance; }
h2.azpititulua { font: 400 30px/1 var(--pixel); margin: 30px 0 10px; letter-spacing: .02em; }
.azalpena { color: var(--tinta-2); margin: 0 0 14px; font-size: 15px; max-width: 60ch; }
.txip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--texto); letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; background: rgba(13, 13, 13, .7); color: var(--tinta); }
.txip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #fff); display: inline-block; }
.botoia { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 4px; padding: 13px 20px;
  font: 400 24px/1 var(--pixel); letter-spacing: .06em; background: var(--rojo); color: var(--crema); text-transform: uppercase; }
.botoia.marino { background: var(--marino); border: 1px solid var(--crema); text-decoration: underline; text-underline-offset: 3px; }
.botoia.krema { background: var(--crema); color: var(--negro); }
.botoia.zabala { width: 100%; }
.botoia:disabled { opacity: .5; cursor: not-allowed; }
.mascara { display: block; width: 100%; height: auto; }
.logo-liquido { display: block; width: 100%; height: auto; }

/* Medidor: tarjeta crema con el logo que se llena y la nota */
.neurgailua { background: var(--crema-logo); color: var(--negro); border-radius: 14px; padding: 10px 10px 8px; display: grid; justify-items: center; gap: 2px; --hueco: var(--crema-logo); }
.neurgailua .zbk { font: 400 34px/1 var(--pixel); }
.neurgailua .zbk small { font-size: 18px; opacity: .6; }
.neurgailua .zer { font: 600 10px var(--texto); letter-spacing: .08em; text-transform: uppercase; opacity: .65; }
.neurgailua.handia { padding: 18px 18px 12px; }
.neurgailua.handia .zbk { font-size: 64px; }

/* ---------- Obras */
.obrak { display: grid; gap: 18px; }
.obra-txartela { position: relative; border-radius: 18px; overflow: hidden; background: var(--gris-3); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.obra-txartela .argazkia { position: relative; aspect-ratio: 4 / 3; background: #4d3733; }
.obra-txartela .argazkia img { width: 100%; height: 100%; object-fit: cover; }
.obra-txartela .argazkia::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, transparent 45%, rgba(13,13,13,.92)); }
.obra-txartela .txip { position: absolute; top: 12px; left: 12px; z-index: 1; }
.obra-txartela .izena { position: absolute; left: 16px; right: 120px; bottom: 14px; z-index: 1; margin: 0; font: 400 40px/.9 var(--pixel); letter-spacing: .02em; text-wrap: balance; }
.obra-txartela .neurgailua { position: absolute; right: 12px; bottom: -6px; z-index: 2; width: 96px; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
.obra-txartela .neurgailua .zbk { font-size: 30px; }
.obra-txartela .behea { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 16px 16px; }
.obra-txartela .datuak { font-size: 13px; color: var(--tinta-2); }
.obra-txartela .datuak b { color: var(--tinta); }
.obra-txartela > button.osoa { position: absolute; inset: 0; z-index: 3; background: none; border: 0; }
.obra-txartela .behea .botoia { position: relative; z-index: 4; }
.errepertorioa { display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin: 0 calc(-1 * var(--lado-d)) 0 0; padding-right: var(--lado-d); }
.errepertorioa::-webkit-scrollbar { display: none; }
.txiki { scroll-snap-align: start; border: 0; padding: 0; text-align: left; background: var(--gris-3); border-radius: 14px; overflow: hidden; }
.txiki .argazkia { aspect-ratio: 4 / 3; background: #4d3733; position: relative; }
.txiki .argazkia img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); }
.txiki .ikusita { position: absolute; top: 8px; right: 8px; background: var(--rojo); color: var(--crema); font: 400 15px var(--pixel); padding: 2px 7px; border-radius: 3px; letter-spacing: .05em; }
.txiki .testua { padding: 8px 10px 10px; }
.txiki .testua b { display: block; font: 400 24px/1 var(--pixel); }
.txiki .testua span { font-size: 12px; color: var(--tinta-2); }

/* ---------- Ficha de obra */
.fitxa-azala { position: relative; margin: 0 calc(-1 * var(--lado-d)) 0 calc(-1 * var(--lado-i)); aspect-ratio: 4 / 3.3; background: #4d3733; }
.fitxa-azala img { width: 100%; height: 100%; object-fit: cover; }
.fitxa-azala::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 30%, transparent 50%, var(--gris) 98%); }
.fitxa-azala .atzera { position: absolute; top: 12px; left: var(--lado-i); z-index: 2; }
.fitxa-azala h1 { position: absolute; left: var(--lado-i); right: var(--lado-d); bottom: 4px; z-index: 2; margin: 0; font: 400 58px/.88 var(--pixel); text-wrap: balance; }
.atzera { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(13, 13, 13, .6); display: grid; place-items: center; }
.atzera svg { width: 22px; height: 22px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 18px; color: var(--tinta-2); font-size: 14px; }
.publikoa { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: center; background: rgba(13, 13, 13, .35); border-radius: 18px; padding: 14px; }
.publikoa h3 { margin: 0 0 4px; font: 400 26px/1 var(--pixel); }
.publikoa p { margin: 0; font-size: 14px; color: var(--tinta-2); }
.alderdiak { display: grid; gap: 12px; margin-top: 18px; }
.alderdia { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.alderdia .izen { font-size: 14px; color: var(--tinta-2); }
.alderdia .zbk { font: 400 24px/1 var(--pixel); }
.maskara-neurria { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 280px; }
.zurea { margin-top: 18px; padding: 14px; border-radius: 16px; border: 1px dashed rgba(255, 253, 240, .35); }
.zurea h3 { margin: 0 0 6px; font: 400 24px/1 var(--pixel); }
.zurea p { margin: 4px 0 0; color: var(--tinta-2); font-size: 14px; }
.ekintza { position: sticky; bottom: calc(var(--abajo) + 84px); margin-top: 22px; z-index: 5; }

/* ---------- Valorar */
.baloratu { position: fixed; inset: 0; z-index: 50; background: var(--gris-3); overflow-y: auto; padding: calc(var(--arriba) + 12px) var(--lado-d) calc(var(--abajo) + 110px) var(--lado-i); }
.baloratu .goia { display: flex; align-items: center; gap: 12px; max-width: 620px; margin: 0 auto; }
.baloratu .urratsak { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.baloratu .urratsak i { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .2); }
.baloratu .urratsak i.eginda { background: var(--rojo-vivo); }
.baloratu .edukia { max-width: 620px; margin: 0 auto; }
.baloratu h2 { font: 400 46px/.95 var(--pixel); margin: 22px 0 4px; }
.galdera { padding: 16px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.galdera .testua { font-weight: 600; margin: 0 0 10px; }
.maskarak { display: grid; grid-template-columns: repeat(5, 1fr) 44px; gap: 6px; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 10px; }
.maskarak button { border: 0; padding: 0; background: none; transition: transform .12s; }
.maskarak button:active { transform: scale(.94); }
.maskarak .mascara.urrea { overflow: visible; }
.maskarak button.piztu { animation: urreztatu .45s ease-out; }
@keyframes urreztatu { 0% { transform: scale(.9); filter: brightness(1.6); } 60% { transform: scale(1.1); } 100% { transform: scale(1); filter: none; } }
.maskarak output { font: 400 30px/1 var(--pixel); text-align: right; color: var(--tinta-3); }
.maskarak output.jarrita { color: var(--crema); }
details.gehiago summary { cursor: pointer; padding: 14px 0; color: var(--tinta-2); font-weight: 600; }
textarea.iritzia { display: block; min-height: 200px; margin-top: 16px; }
textarea { width: 100%; min-height: 84px; resize: vertical; font: 16px/1.45 var(--texto); color: var(--negro); background: var(--crema); border: 0; border-radius: 10px; padding: 10px 12px; }
.baloratu .beheko { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; display: flex; gap: 10px; padding: 12px var(--lado-d) calc(var(--abajo) + 12px) var(--lado-i); background: linear-gradient(180deg, transparent, var(--gris-3) 30%); }
.baloratu .beheko > * { max-width: 620px; }
.baloratu .beheko .botoia { flex: 1; }
.oharra { color: #ffb3b3; min-height: 1.4em; font-size: 14px; margin: 8px 0 0; }

/* Resultado */
.emaitza { text-align: center; padding-top: 30px; }
.emaitza .neurgailua { width: min(240px, 70vw); margin: 18px auto 10px; }
.emaitza h2 { font: 400 64px/.9 var(--pixel); margin: 0; }
.emaitza .alderaketa { display: flex; justify-content: center; gap: 22px; margin: 10px 0 18px; }
.emaitza .alderaketa div { display: grid; }
.emaitza .alderaketa b { font: 400 40px/1 var(--pixel); }
.emaitza .alderaketa span { font-size: 12px; color: var(--tinta-2); text-transform: uppercase; letter-spacing: .08em; }
.izar-berria { display: inline-flex; gap: 8px; align-items: center; background: rgba(13, 13, 13, .4); padding: 10px 14px; border-radius: 999px; margin-bottom: 18px; }
.konfetia { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

/* ---------- Butacas (próximamente) y punto «en directo» */
.zuzenean { display: inline-flex; align-items: center; gap: 8px; font: 400 20px var(--pixel); letter-spacing: .08em; color: var(--rojo-vivo); }
.zuzenean i { width: 10px; height: 10px; border-radius: 50%; background: var(--rojo-vivo); animation: taupada 1.2s infinite; }
@keyframes taupada { 50% { opacity: .25; transform: scale(.7); } }
.hutsik.laster .ikur { width: 74px; color: var(--crema-logo); }
.laster-txip { font: 400 24px/1 var(--pixel); letter-spacing: .12em; text-transform: uppercase; background: var(--crema); color: var(--negro); padding: 6px 12px 4px; border-radius: 4px; }

/* ---------- Constelación */
.zerua { position: relative; margin: 14px calc(-1 * var(--lado-d)) 0 calc(-1 * var(--lado-i)); background: radial-gradient(circle at 50% 46%, #1d1630 0%, #0b0a1a 60%, #050509 100%); border-radius: 0; overflow: hidden; touch-action: manipulation; }
.zerua canvas { display: block; width: 100%; height: auto; }
.izar-txartela { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--crema); color: var(--negro); border-radius: 14px; padding: 10px; margin-top: 12px; }
.izar-txartela img { width: 92px; height: 70px; object-fit: cover; border-radius: 8px; }
.izar-txartela b { display: block; font: 400 28px/1 var(--pixel); }
.izar-txartela span { font-size: 13px; color: #444; }
.izar-txartela .maskara-neurria { max-width: 170px; gap: 3px; margin-top: 4px; }
.estatistikak { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.estatistikak div { background: rgba(13, 13, 13, .35); border-radius: 12px; padding: 10px; }
.estatistikak b { display: block; font: 400 38px/1 var(--pixel); }
.estatistikak span { font-size: 12px; color: var(--tinta-2); }
.izena-konst { font: 400 30px/1 var(--pixel); color: var(--crema-logo); margin: 4px 0 0; }
.generoak { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.hutsik { text-align: center; padding: 40px 10px; background: rgba(13, 13, 13, .3); border-radius: 18px; margin-top: 14px; display: grid; gap: 14px; justify-items: center; }
.hutsik .ikur { width: 90px; }
.hutsik p { margin: 0; color: var(--tinta-2); max-width: 36ch; }

/* ---------- Wrapped */
.wrapped-sarrera { display: grid; gap: 14px; margin-top: 14px; }
.wrapped-txartela { position: relative; overflow: hidden; border: 0; border-radius: 22px; padding: 22px 20px; min-height: 210px; text-align: left; display: grid; align-content: end; gap: 6px; }
.wrapped-txartela.mundiala { background: var(--rojo); color: var(--crema); }
.wrapped-txartela.pertsonala { background: var(--crema); color: var(--negro); }
.wrapped-txartela b { font: 400 54px/.88 var(--pixel); position: relative; }
.wrapped-txartela span { position: relative; font-weight: 600; }
.wrapped-txartela .forma { position: absolute; width: 220px; right: -40px; top: -30px; opacity: .9; }
.istorioa { position: fixed; inset: 0; z-index: 80; background: #000; color: var(--crema); overflow: hidden; }
.istorioa .barrak { position: absolute; z-index: 3; top: calc(var(--arriba) + 10px); left: 10px; right: 10px; display: flex; gap: 4px; }
.istorioa .barrak i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.istorioa .barrak i b { display: block; height: 100%; width: 0; background: #fff; }
.istorioa .barrak i.ikusita b { width: 100%; }
.istorioa .barrak i.oraingoa b { animation: aurrera var(--iraupena, 6s) linear forwards; }
.istorioa.geldi .barrak i.oraingoa b { animation-play-state: paused; }
@keyframes aurrera { to { width: 100%; } }
.istorioa .itxi { position: absolute; z-index: 4; top: calc(var(--arriba) + 22px); right: 12px; border: 0; background: rgba(0, 0, 0, .3); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; }
.istorioa .ukitu { position: absolute; z-index: 2; top: 0; bottom: 0; width: 35%; border: 0; background: none; }
.istorioa .ukitu.ezk { left: 0; } .istorioa .ukitu.esk { right: 0; width: 65%; }
.diapo { position: absolute; inset: 0; padding: calc(var(--arriba) + 70px) 26px calc(var(--abajo) + 40px); display: flex; flex-direction: column; justify-content: center; gap: 14px; overflow: hidden; }
.diapo > * { position: relative; z-index: 1; }
.diapo .forma { position: absolute; z-index: 0; pointer-events: none; }
.diapo .goiburu { font: 600 13px var(--texto); letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
.diapo .erraldoia { font: 400 min(42vw, 230px)/.8 var(--pixel); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.diapo .handia { font: 400 min(15vw, 84px)/.9 var(--pixel); text-wrap: balance; }
.diapo .ertaina { font: 400 min(9vw, 46px)/.95 var(--pixel); text-wrap: balance; }
.diapo p { margin: 0; font-size: 17px; max-width: 30ch; }
.diapo .argazki { width: 78%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; transform: rotate(-3deg); box-shadow: 10px 10px 0 rgba(0, 0, 0, .35); }
.diapo .neurgailua { width: 44%; max-width: 220px; }
.diapo .zerrenda { display: grid; gap: 10px; }
.diapo .zerrenda div { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.diapo .zerrenda .zenb { font: 400 32px/1 var(--pixel); opacity: .7; }
.diapo .zerrenda .izen { font: 400 30px/1 var(--pixel); }
.diapo .zerrenda .bar { grid-column: 2 / -1; height: 12px; background: currentColor; opacity: .9; transform-origin: left; animation: hazi 1s ease-out both; }
@keyframes hazi { from { transform: scaleX(0); } }
.diapo .orduak { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 120px; }
.diapo .orduak i { background: currentColor; opacity: .35; transform-origin: bottom; animation: gora .9s ease-out both; }
.diapo .orduak i.max { opacity: 1; }
@keyframes gora { from { transform: scaleY(0); } }
.diapo .erdibitu { display: flex; height: 64px; border-radius: 6px; overflow: hidden; font: 400 28px var(--pixel); }
.diapo .erdibitu div { display: grid; place-items: center; animation: hazi 1s ease-out both; }
.diapo .agertu { animation: agertu .7s ease-out both; }
.diapo .agertu.b { animation-delay: .25s; } .diapo .agertu.c { animation-delay: .5s; } .diapo .agertu.d { animation-delay: .8s; }
@keyframes agertu { from { opacity: 0; transform: translateY(18px); } }
.diapo .aipua { font: 400 min(10vw, 48px)/1 var(--pixel); }

/* ---------- Hoja de ajustes */
.orria { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .55); display: grid; align-items: end; }
.orria .barrua { background: var(--gris-3); border-radius: 22px 22px 0 0; padding: 18px var(--lado-d) calc(var(--abajo) + 22px) var(--lado-i); max-height: 85dvh; overflow-y: auto; }

.telon .v .medal { padding: 5px; }
.telon .marca { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.telon .marca b { font: 800 34px 'Playfair Display', Georgia, serif; letter-spacing: 6px; color: #e8c36a; text-shadow: 0 2px 0 #3b050c; }
.telon .marca small { font-size: 12px; letter-spacing: 4px; color: #f3dfb0; text-transform: uppercase; }
.telon .v .marca b { font-size: 24px; letter-spacing: 4px; }
.telon .v .marca small { font-size: 10px; letter-spacing: 3px; }

/* Telones */
.telon .curtain { position: absolute; top: 0; height: calc(640px + var(--dy)); width: 50%; z-index: 2;
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(0,0,0,.5) 100%),
    repeating-linear-gradient(90deg, #4a0710 0px, #7d111c 22px, #b0222e 40px, #c9343f 48px, #9a1a25 60px, #5e0b15 80px); }
.telon .curtain::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 16px;
  background: repeating-linear-gradient(90deg, #e0b04a 0 3px, #8a6420 3px 6px); border-top: 3px solid #c9973a; }
.telon .curtain.left { left: 0; transform-origin: left top; box-shadow: inset -26px 0 34px rgba(0,0,0,.65); }
.telon .curtain.right { right: 0; transform-origin: right top; box-shadow: inset 26px 0 34px rgba(0,0,0,.65); }
.telon .v .curtain { height: calc(744px + var(--dy));
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,.5) 100%),
    repeating-linear-gradient(90deg, #4a0710 0px, #7d111c 16px, #b0222e 30px, #c9343f 36px, #9a1a25 45px, #5e0b15 60px); }
.telon .v .curtain::after { bottom: -12px; height: 13px; }
.telon .v .curtain.left { box-shadow: inset -20px 0 26px rgba(0,0,0,.65); }
.telon .v .curtain.right { box-shadow: inset 20px 0 26px rgba(0,0,0,.65); }

/* Bambalina con el nombre */
.telon .valance { position: absolute; top: 0; left: 0; right: 0; height: 96px; z-index: 6; display: flex; align-items: center; justify-content: center; gap: 18px;
  background: linear-gradient(180deg, #3b050c 0%, #7d111c 55%, #5e0b15 100%); border-bottom: 4px solid #c9973a; box-shadow: 0 10px 24px rgba(0,0,0,.6); }
.telon .valance::after { content: ""; position: absolute; left: 0; right: 0; bottom: -26px; height: 26px;
  background: radial-gradient(circle at 40px -10px, #6d0e18 38px, transparent 39px) 0 0 / 80px 26px repeat-x; }
.telon .valance .medal { width: 64px; height: 64px; }
.telon .v .valance { height: 80px; gap: 12px; border-bottom-width: 3px; box-shadow: 0 8px 20px rgba(0,0,0,.6); }
.telon .v .valance::after { bottom: -20px; height: 20px; background: radial-gradient(circle at 30px -8px, #6d0e18 28px, transparent 29px) 0 0 / 60px 20px repeat-x; }
.telon .v .valance .medal { width: 50px; height: 50px; }

/* Suelo del escenario */
.telon .floor { position: absolute; left: 0; right: 0; top: calc(640px + var(--dy)); bottom: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%), repeating-linear-gradient(90deg, #3a2414 0 118px, #2a190e 118px 120px);
  border-top: 2px solid #5a3a22; }
.telon .v .floor { top: calc(744px + var(--dy));
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%), repeating-linear-gradient(90deg, #3a2414 0 78px, #2a190e 78px 80px); }

/* Puntos suspensivos que saltan */
.telon .puntos { display: flex; gap: 5px; }
.telon .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #e8c36a; animation: telonPunto 1.2s ease-in-out infinite; }
.telon .dot:nth-child(2) { animation-delay: .2s; }
.telon .dot:nth-child(3) { animation-delay: .4s; }
.telon .v .puntos { gap: 4px; }
.telon .v .dot { width: 5px; height: 5px; animation-name: telonPuntoV; }
@keyframes telonPunto { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
@keyframes telonPuntoV { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

.telon { animation: telonSeguro 0s 25s forwards; }
@keyframes telonSeguro { to { visibility: hidden; pointer-events: none; } }
.telon.paso { pointer-events: none; }
.telon .curtain { animation: telonVaivenH 6s ease-in-out infinite alternate; }
.telon .v .curtain { animation-name: telonVaivenV; }
.telon .curtain.right { animation-delay: -3s; }
/* Con el vaivén, los telones asoman 12 px por fuera de la pantalla para no dejar ver la app por los bordes. */
.telon .curtain.left { left: -12px; width: calc(50% + 12px); }
.telon .curtain.right { right: -12px; width: calc(50% + 12px); }
.telon .curtain, .telon .rose-x, .telon .rose-y, .telon .rose-r { will-change: transform; }
@keyframes telonVaivenH { 0% { transform: skewX(0deg); } 100% { transform: skewX(.6deg); } }
@keyframes telonVaivenV { 0% { transform: skewX(0deg); } 100% { transform: skewX(.8deg); } }
.telon .foco { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.telon .spot { position: absolute; inset: 0; animation: telonPulso 3.2s ease-in-out infinite;
  background: radial-gradient(ellipse 420px 560px at 50% 62%, rgba(255,214,140,.22), rgba(255,214,140,0) 70%); }
.telon .v .spot { background: radial-gradient(ellipse 220px 520px at 50% 62%, rgba(255,214,140,.22), rgba(255,214,140,0) 70%); }
@keyframes telonPulso { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
.telon .cargando { position: absolute; left: 0; right: 0; top: calc(250px + var(--dy) / 2); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.telon .v .cargando { top: calc(330px + var(--dy) / 2); gap: 12px; }
.telon .cargando .medal { width: 150px; height: 150px; margin-bottom: 12px; }
.telon .v .cargando .medal { width: 130px; height: 130px; }
.telon .rotulo { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 5px; color: #f3dfb0; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
.telon .v .rotulo { gap: 8px; font-size: 11px; letter-spacing: 3px; }
.telon .textos { display: grid; justify-items: center; }
.telon .textos > span { grid-area: 1 / 1; white-space: nowrap; transition: opacity .35s ease-in-out; }
.telon .t-abre { opacity: 0; }
.telon .bar { position: relative; width: 240px; height: 3px; border-radius: 2px; background: rgba(232,195,106,.2); overflow: hidden; transition: opacity .35s ease-in-out; }
.telon .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 80px; background: linear-gradient(90deg, transparent, #e8c36a, transparent); animation: telonBrilloH 1.6s ease-in-out infinite; }
.telon .v .bar { width: 180px; }
.telon .v .bar::after { width: 60px; animation-name: telonBrilloV; }
@keyframes telonBrilloH { 0% { left: -80px; } 100% { left: 240px; } }
@keyframes telonBrilloV { 0% { left: -60px; } 100% { left: 180px; } }
/* Rosas: tres capas (avance lateral, vuelo y caída, giro), 7 s por lanzamiento. */
.telon .rosas { position: absolute; left: 0; right: 0; top: var(--dy); height: 720px; z-index: 7; pointer-events: none; }
.telon .v .rosas { height: 844px; }
.telon .rose-x { position: absolute; top: 0; animation: 7s linear infinite backwards; }
.telon .rose-y, .telon .rose-r { animation: 7s infinite backwards; }
.telon .rose-r { width: 52px; height: 85px; }
.telon .v .rose-r { width: 40px; height: 65px; }
.telon .rose-r svg { display: block; width: 100%; height: 100%; }
.telon .h .xa { animation-name: telonRosaXaH; } .telon .h .xb { animation-name: telonRosaXbH; }
.telon .h .xc { animation-name: telonRosaXcH; } .telon .h .xd { animation-name: telonRosaXdH; }
.telon .h .y1 { animation-name: telonRosaY1H; } .telon .h .y2 { animation-name: telonRosaY2H; } .telon .h .y3 { animation-name: telonRosaY3H; }
.telon .v .xa { animation-name: telonRosaXaV; } .telon .v .xb { animation-name: telonRosaXbV; }
.telon .v .xc { animation-name: telonRosaXcV; } .telon .v .xd { animation-name: telonRosaXdV; }
.telon .v .y1 { animation-name: telonRosaY1V; } .telon .v .y2 { animation-name: telonRosaY2V; } .telon .v .y3 { animation-name: telonRosaY3V; }
.telon .r1 { animation-name: telonRosaR1; animation-timing-function: linear; }
.telon .r2 { animation-name: telonRosaR2; animation-timing-function: linear; }
.telon .r3 { animation-name: telonRosaR3; animation-timing-function: linear; }
@keyframes telonRosaXaH { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(-110px); } }
@keyframes telonRosaXbH { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(70px); } }
@keyframes telonRosaXcH { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(150px); } }
@keyframes telonRosaXdH { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(-160px); } }
@keyframes telonRosaXaV { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(-50px); } }
@keyframes telonRosaXbV { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(35px); } }
@keyframes telonRosaXcV { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(60px); } }
@keyframes telonRosaXdV { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(-65px); } }

<script>
"use strict";
// Encaja la escena del telón en la pantalla: la escala hasta que se ve entera (nada se corta)
// y estira el escenario para llenar lo que sobra (telones y suelo más altos, o más anchos).
function telonEncajar(telon) {
  const vertical = matchMedia("(orientation: portrait)").matches;
  const el = telon.querySelector(vertical ? ".v" : ".h");
  const w = vertical ? 390 : 1280, h = vertical ? 844 : 720;
  const W = telon.clientWidth || innerWidth, H = telon.clientHeight || innerHeight;
  const s = Math.min(W / w, H / h);
  const ancho = Math.max(w, Math.ceil(W / s) + 2), alto = Math.max(h, Math.ceil(H / s) + 2);
  el.style.width = ancho + "px";
  el.style.height = alto + "px";
  el.style.setProperty("--dy", (alto - h) + "px");
  el.style.transform = `translate(-50%, -50%) scale(${s})`;
}
function telonVigilar(telon) {
  const encajar = () => telonEncajar(telon);
  encajar();
  addEventListener("resize", encajar);
  addEventListener("orientationchange", encajar);
  // El tamaño del telón puede cambiar sin evento resize (zoom del móvil, barras del navegador).
  const ro = typeof ResizeObserver === "function" ? new ResizeObserver(encajar) : null;
  if (ro) ro.observe(telon);
  return () => { removeEventListener("resize", encajar); removeEventListener("orientationchange", encajar); if (ro) ro.disconnect(); };
}

// Telón de entrada: la carga dura al menos 3,2 s (dos pasadas de la barra, primeras rosas en el suelo)
// y, cuando la página ha cargado, se abre entero. Tocar la pantalla adelanta la apertura.
(() => {
  const telon = document.getElementById("telon");
  if (/^#(pantalla|pantaila)$/.test(location.hash)) { telon.remove(); return; }
  try {
    let lang = (navigator.language || "eu").startsWith("es") ? "es" : "eu";
    try { lang = JSON.parse(localStorage.getItem("txalometroa-mugikorra")).lang || lang; } catch (e) { /* sin datos guardados */ }
    // EU: textos nuevos, pendientes de revisión por un hablante nativo.
    const tx = lang === "es" ? { carga: "Preparando la función", abre: "¡Que empiece la función!" }
                             : { carga: "Emanaldia prestatzen", abre: "Has dadila emanaldia!" };
    const rosa = `<svg viewBox="0 0 44 72" aria-hidden="true"><path d="M22 30 C21 45 23 55 22 70" stroke="#2f6b2a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M22 48 C14 42 9 46 8 50 C14 52 19 51 22 48Z" fill="#3d8a35"/><path d="M22 56 C30 50 35 53 36 57 C30 59 25 59 22 56Z" fill="#3d8a35"/><path d="M18 27 L22 33 L26 27Z" fill="#2f6b2a"/><path d="M10 18 C10 5 34 5 34 18 C34 31 10 31 10 18Z" fill="#a3121f"/><path d="M13 14 C16 3 30 5 31 14 C26 10 18 10 13 14Z" fill="#d42a38"/><path d="M16 18 C18 10 28 12 28 18 C25 15 20 15 16 18Z" fill="#6e0812"/><path d="M14 22 C18 29 28 29 31 21 C26 25 19 25 14 22Z" fill="#c21d2b"/></svg>`;
    // Cada rosa: avance lateral, vuelo, giro, posición (%) y retraso (s).
    const ROSAS = {
      h: [["xa", "y1", "r1", 46, 0], ["xc", "y2", "r2", 30, .6], ["xb", "y3", "r3", 62, 1.1], ["xd", "y1", "r2", 74, 1.7], ["xb", "y3", "r1", 22, 2.3],
          ["xc", "y2", "r3", 54, 2.9], ["xa", "y1", "r2", 38, 3.5], ["xa", "y2", "r1", 80, 4.1], ["xc", "y3", "r3", 16, 4.7]],
      v: [["xa", "y1", "r1", 48, 0], ["xc", "y2", "r2", 22, .8], ["xb", "y3", "r3", 64, 1.6], ["xd", "y1", "r2", 78, 2.4], ["xb", "y3", "r1", 14, 3.2],
          ["xc", "y2", "r3", 54, 4], ["xa", "y1", "r2", 36, 4.8]]
    };
    for (const o of ["h", "v"]) {
      telon.querySelector("." + o).innerHTML = `<div class="floor"></div><div class="curtain left"></div><div class="curtain right"></div>
        <div class="foco"><div class="spot"></div></div>
        <div class="valance"><span class="medal"></span><div class="marca"><b>TXALOMETROA</b><small>Hika Teatroa</small></div></div>
        <div class="cargando"><span class="medal"></span>
          <div class="rotulo"><span class="textos"><span class="t-carga">${tx.carga}</span><span class="t-abre">${tx.abre}</span></span>
            <span class="puntos"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
          <div class="bar"></div></div>
        <div class="rosas">${ROSAS[o].map(([x, y, r, izq, d]) => `<div class="rose-x ${x}" style="left:${izq}%;animation-delay:${d}s"><div class="rose-y ${y}" style="animation-delay:${d}s"><div class="rose-r ${r}" style="animation-delay:${d}s">${rosa}</div></div></div>`).join("")}</div>`;
    }
    const soltar = telonVigilar(telon);
    const cerrar = () => { soltar(); telon.remove(); };
    let abierto = false;
    const abrir = () => {
      if (abierto) return;
      abierto = true;
      telon.classList.add("abre");
      setTimeout(() => telon.classList.add("paso"), 2600);   // telones ya medio abiertos: se puede tocar la app
      telon.addEventListener("animationend", e => { if (e.animationName.startsWith("telonSube")) cerrar(); });
      setTimeout(cerrar, 6000);
    };
    const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const espera = ms => new Promise(r => setTimeout(r, ms));
    const cargada = new Promise(r => document.readyState === "complete" ? r() : addEventListener("load", r, { once: true }));
    Promise.all([espera(reducir ? 0 : 3200), Promise.race([cargada, espera(10000)])]).then(abrir);
    addEventListener("DOMContentLoaded", () => telon.addEventListener("pointerdown", abrir), { once: true });
  } catch (e) { telon.remove(); }
})();
</script>

<script>
"use strict";

// Núcleo del Txalometroa: lectura del export, limpieza, análisis y bloque
// público. Lo comparten la app (app/txalometroa.src.html) y la réplica de la
// web (replica/replica.src.html); construir.py lo incrusta en las dos.

const PREG = ["GAL1", "GAL2", "GAL3", "GAL4", "GAL5", "GAL6", "GAL7"];

// ---------------------------------------------------------------- Lectura

const BOM = String.fromCharCode(0xFEFF);

function parsearTexto(texto) {
  if (texto.startsWith(BOM)) texto = texto.slice(1);
  const primera = texto.split(/\r?\n/, 1)[0];
  const delim = primera.includes("\t") ? "\t" : primera.includes(";") ? ";" : ",";
  const filas = [];
  let fila = [], campo = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') comillas = false;
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === delim) { fila.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      fila.push(campo); filas.push(fila); fila = []; campo = "";
    } else campo += c;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter(f => f.some(v => String(v).trim() !== ""));
}

function aObjetos(matriz) {
  const cab = matriz[0].map(h => String(h).trim().toUpperCase());
  const faltan = ["PRODUKZIOA", "NOIZ", ...PREG].filter(c => !cab.includes(c));
  if (faltan.length) throw new Error(`Al fichero le faltan columnas: ${faltan.join(", ")}. ¿Es el export del Txalometroa?`);
  return matriz.slice(1).map(f => Object.fromEntries(cab.map((h, i) => [h, f[i] ?? ""])));
}

function cargarSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => ko(new Error("No se pudo cargar el lector de Excel. Guarda el fichero como CSV o texto con tabulaciones."));
    document.head.append(s);
  });
}

async function leerFichero(buf) {
  const b = new Uint8Array(buf.slice(0, 4));
  const binario = (b[0] === 0xD0 && b[1] === 0xCF) || (b[0] === 0x50 && b[1] === 0x4B);
  if (binario) {
    await cargarSheetJS();
    const libro = XLSX.read(buf, { type: "array", cellDates: true });
    const hoja = libro.Sheets[libro.SheetNames[0]];
    const filas = aObjetos(XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: "" }));
    // Las fechas de Excel llegan como Date: se pasan a texto local para poder guardarlas.
    for (const f of filas) if (f.NOIZ instanceof Date) {
      const d = f.NOIZ;
      f.NOIZ = `${d.getFullYear()}-${dd(d.getMonth() + 1)}-${dd(d.getDate())} ${dd(d.getHours())}:${dd(d.getMinutes())}:${dd(d.getSeconds())}`;
    }
    return filas;
  }
  let texto;
  try { texto = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { texto = new TextDecoder("windows-1252").decode(buf); }
  return aObjetos(parsearTexto(texto));
}

function parsearFecha(v) {
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0));
  return null;
}

// ---------------------------------------------------------------- Limpieza y análisis

const slug = s => s.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const media = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
const pct = (parte, total) => total ? Math.round(100 * parte / total) : 0;
const r2 = x => Math.round(x * 100) / 100;

function limpiar(filas, cfg) {
  const alias = {};
  for (const [id, o] of Object.entries(cfg.obras)) for (const n of o.alias) alias[n.trim().toLowerCase()] = id;
  const validas = [], sinMapear = new Set(), ultima = {};
  const descartes = { vacias: 0, sin_obra: 0, duplicadas: 0, sin_fecha: 0 };

  for (const f of filas) {
    const notas = {};
    for (const g of PREG) { const v = parseInt(f[g], 10) || 0; notas[g] = v >= 1 && v <= 10 ? v : null; }
    if (PREG.every(g => notas[g] === null)) { descartes.vacias++; continue; }
    const nombre = String(f.PRODUKZIOA ?? "").trim();
    if (!nombre) { descartes.sin_obra++; continue; }
    const cuando = parsearFecha(f.NOIZ);
    if (!cuando) { descartes.sin_fecha++; continue; }
    let obra = alias[nombre.toLowerCase()];
    if (!obra) { obra = slug(nombre); sinMapear.add(nombre); }

    const prev = ultima[obra];
    const firma = PREG.map(g => notas[g]).join(",");
    if (prev && prev.firma === firma && (cuando - prev.cuando) / 1000 <= cfg.limpieza.segundos_duplicado) { descartes.duplicadas++; continue; }

    const deObra = cfg.nota_obra.map(g => notas[g]).filter(v => v !== null);
    const r = { id: f.ID, obra, nombre, idioma: String(f.HIZKUNTZA ?? "").trim(), cuando, notas, firma,
                media: deObra.length ? media(deObra) : null };
    validas.push(r); ultima[obra] = r;
  }
  validas.sort((a, b) => a.cuando - b.cuando);

  // Funciones: bloques de respuestas de una obra sin huecos de más de N horas.
  const hueco = cfg.limpieza.horas_entre_funciones * 3600e3, finPorObra = {};
  for (const r of validas) {
    const act = finPorObra[r.obra];
    if (!act || r.cuando - act.fin > hueco) finPorObra[r.obra] = { id: `${r.obra}-${+r.cuando}`, fin: r.cuando };
    finPorObra[r.obra].fin = r.cuando;
    r.funcion = finPorObra[r.obra].id;
  }
  return { validas, descartes, sinMapear: [...sinMapear].sort() };
}

function metricas(rs, cfg) {
  const ms = rs.map(r => r.media).filter(m => m !== null);
  const rec = rs.map(r => r.notas[cfg.pregunta_recomendacion]).filter(v => v !== null);
  const prom = pct(rec.filter(v => v >= 9).length, rec.length), detr = pct(rec.filter(v => v <= 6).length, rec.length);
  return {
    n: rs.length,
    nota: ms.length ? r2(media(ms)) : null,
    pct_muy_satisfechos: pct(ms.filter(m => m >= 9).length, ms.length),
    pct_insatisfechos: pct(ms.filter(m => m <= 6).length, ms.length),
    pct_recomendaria: prom,
    indice_recomendacion: rec.length ? prom - detr : null,
  };
}

function metricasPregunta(rs, g) {
  const vs = rs.map(r => r.notas[g]).filter(v => v !== null);
  return { n: vs.length, media: vs.length ? r2(media(vs)) : null,
           pct_10: pct(vs.filter(v => v === 10).length, vs.length), pct_bajo: pct(vs.filter(v => v <= 6).length, vs.length) };
}

function analizar(filas, cfg) {
  const { validas, descartes, sinMapear } = limpiar(filas, cfg);
  if (!validas.length) throw new Error("No hay ninguna respuesta válida en el fichero.");
  const ids = [...new Set(validas.map(r => r.obra))];
  const obras = ids.map(id => {
    const rs = validas.filter(r => r.obra === id);
    const info = cfg.obras[id] || { eu: rs[0].nombre, es: rs[0].nombre };
    const funciones = [...new Set(rs.map(r => r.funcion))].map(fid => {
      const fr = rs.filter(r => r.funcion === fid);
      return { id: fid, inicio: fr[0].cuando, fin: fr.at(-1).cuando, fiable: fr.length >= cfg.limpieza.min_respuestas_funcion, ...metricas(fr, cfg) };
    });
    return { id, eu: info.eu, es: info.es, imagen: info.imagen || "", primera: rs[0].cuando, ultima: rs.at(-1).cuando, ...metricas(rs, cfg),
             preguntas: Object.fromEntries(PREG.map(g => [g, metricasPregunta(rs, g)])), funciones };
  }).sort((a, b) => b.n - a.n);

  const res = { generado: new Date(), filas: filas.length, validas, descartes, sinMapear, obras,
                desde: validas[0].cuando, hasta: validas.at(-1).cuando, global: metricas(validas, cfg) };
  res.conclusiones = conclusiones(res, cfg);
  return res;
}

function conclusiones(res, cfg) {
  const t = [], et = g => cfg.preguntas[g].es;
  for (const o of res.obras) {
    if (o.n < cfg.publicacion.min_respuestas_obra) { t.push(`«${o.es}» solo tiene ${o.n} respuestas: aún no es representativo.`); continue; }
    const ms = cfg.nota_obra.filter(g => o.preguntas[g].media !== null).map(g => [g, o.preguntas[g].media]);
    const floja = ms.reduce((a, b) => b[1] < a[1] ? b : a), fuerte = ms.reduce((a, b) => b[1] > a[1] ? b : a);
    const ind = o.indice_recomendacion;
    t.push(`«${o.es}»: ${fmt(o.nota)} de nota con ${o.n} respuestas; el ${o.pct_recomendaria}% la recomendaría (índice de recomendación ${ind >= 0 ? "+" : ""}${ind}). ` +
           `Lo mejor valorado: ${et(fuerte[0]).toLowerCase()} (${fmt(fuerte[1])}); lo más flojo: ${et(floja[0]).toLowerCase()} (${fmt(floja[1])}).`);
    const fiables = o.funciones.filter(f => f.fiable && f.nota !== null);
    if (fiables.length >= 3) {
      const peor = fiables.reduce((a, b) => b.nota < a.nota ? b : a);
      if (o.nota - peor.nota >= 0.5)
        t.push(`«${o.es}»: la función del ${fecha(peor.inicio)} quedó por debajo (${fmt(peor.nota)} con ${peor.n} respuestas). Vale la pena revisar qué pasó ese día.`);
    }
  }
  const bloque = b => PREG.filter(g => cfg.preguntas[g].bloque === b).map(g => [g, metricasPregunta(res.validas, g)]);
  const fid = bloque("publico");
  if (fid.length) t.push("Fidelidad: " + fid.map(([g, m]) => `«${et(g)}» ${fmt(m.media)} (${m.pct_bajo}% da 6 o menos)`).join("; ") + ". Es lo que indica si el público volverá.");
  for (const [g, m] of bloque("localidad"))
    t.push(`«${et(g)}» saca ${fmt(m.media)}, pero no habla de la obra sino del municipio: no entra en la nota de las obras. El formulario no guarda la localidad, así que solo se puede cruzar por fecha de función.`);
  const d = res.descartes;
  if (d.vacias) t.push(`${d.vacias} envíos llegaron con todos los deslizadores a 0 (se pulsó TXALOTU sin mover nada). El formulario debería exigir al menos una respuesta.`);
  if (d.sin_obra) t.push(`${d.sin_obra} respuestas llegaron sin obra y no se pueden usar; el formulario no debería guardar un envío si no sabe a qué obra pertenece.`);
  if (d.duplicadas) t.push(`${d.duplicadas} envíos eran duplicados (mismas notas en pocos segundos, típico doble clic o recarga). Se evita desactivando el botón tras enviar.`);
  const todas = res.validas.flatMap(r => PREG.map(g => r.notas[g])).filter(v => v !== null);
  const p10 = pct(todas.filter(v => v === 10).length, todas.length);
  if (p10 >= 50) t.push(`El ${p10}% de las notas son un 10: la escala se satura y las medias se parecen mucho. Por eso conviene mirar también el % de notas bajas (≤6) y el % que la recomendaría.`);
  if (res.sinMapear.length) t.push(`Hay nombres de obra que no están en Ajustes: ${res.sinMapear.join(", ")}. Añádelos para unir sus versiones eu/es.`);
  return t;
}

// ---------------------------------------------------------------- Formato

const fmt = (x, d = 1) => x === null || x === undefined ? "–" : x.toFixed(d).replace(".", ",");
const dd = n => String(n).padStart(2, "0");
const fecha = d => `${dd(d.getDate())}/${dd(d.getMonth() + 1)}/${d.getFullYear()}`;
const fechaHora = d => `${fecha(d)} ${dd(d.getHours())}:${dd(d.getMinutes())}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------- Bloque público (reseña)

const TXT_BLOQUE = {
  eu: { titulo: "Ikusleen iritzia", sub: "Txalometroan jasotako balorazioak, 1etik 10era",
        resp: n => `${n} balorazio`, pct: p => `%${p}k gomendatuko luke`, act: f => `Eguneratua: ${f}` },
  es: { titulo: "La opinión del público", sub: "Valoraciones recogidas en el Txalometro, del 1 al 10",
        resp: n => `${n} valoraciones`, pct: p => `El ${p}% la recomendaría`, act: f => `Actualizado: ${f}` },
};

const CSS_BLOQUE = `
.txalo-emaitzak { --txalo-gorria: #ff3c42; --txalo-testua: #595b60; margin: 40px 0; color: var(--txalo-testua); }
.txalo-emaitzak * { box-sizing: border-box; }
.txalo-emaitzak .txalo-izenburua { font-weight: 300; font-size: 2.2rem; letter-spacing: .03em; text-align: center; margin: 0; color: var(--txalo-testua); }
.txalo-emaitzak .txalo-azpi { text-align: center; font-size: .95rem; margin: 6px 0 28px; opacity: .8; }
.txalo-emaitzak .txalo-lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px; }
.txalo-emaitzak .txalo-obra { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 28px rgba(30, 20, 20, .10); display: flex; flex-direction: column; }
.txalo-emaitzak .txalo-irudia { position: relative; aspect-ratio: 3 / 2; background: #4d3733; }
.txalo-emaitzak .txalo-irudia img { display: block; width: 100%; height: 100%; object-fit: cover; margin: 0; }
.txalo-emaitzak .txalo-irudia::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.72)); }
.txalo-emaitzak .txalo-izena { position: absolute; left: 20px; right: 120px; bottom: 16px; z-index: 1; margin: 0; color: #fff; font-weight: 700; font-size: 1.45rem; line-height: 1.15; }
.txalo-emaitzak .txalo-nota { position: absolute; right: 16px; bottom: -52px; z-index: 2; width: 104px; border-radius: 14px; background: #fdeec7;
  padding: 10px 10px 8px; display: grid; justify-items: center; gap: 2px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.txalo-emaitzak .txalo-nota svg { display: block; width: 100%; height: auto; }
.txalo-emaitzak .txalo-nota span { font-weight: 700; font-size: 1.5rem; line-height: 1; color: #231f20; font-variant-numeric: tabular-nums; }
.txalo-emaitzak .txalo-nota small { font-size: .7rem; font-weight: 400; color: var(--txalo-testua); margin-left: 2px; }
.txalo-emaitzak .txalo-gorputza { padding: 18px 20px 22px; display: grid; gap: 16px; }
.txalo-emaitzak .txalo-datuak { display: flex; flex-wrap: wrap; gap: 6px; margin-right: 118px; min-height: 40px; font-size: .82rem; }
.txalo-emaitzak .txalo-txip { background: #f2f2f3; border-radius: 999px; padding: 3px 10px; }
.txalo-emaitzak .txalo-txip.gorria { background: #ffe8e9; color: #c4161c; font-weight: 600; }
.txalo-emaitzak .txalo-barrak { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: .9rem; }
.txalo-emaitzak .txalo-barrak li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; margin: 0; padding: 0; }
.txalo-emaitzak .txalo-barrak li::before { content: none; }
.txalo-emaitzak .txalo-barrak b { font-weight: 700; color: #231f20; font-variant-numeric: tabular-nums; }
.txalo-emaitzak .txalo-barra { grid-column: 1 / -1; height: 6px; background: #eeeeef; border-radius: 3px; overflow: hidden; }
.txalo-emaitzak .txalo-barra i { display: block; height: 100%; background: var(--txalo-gorria); border-radius: 3px; }
.txalo-emaitzak .txalo-pie { text-align: center; font-size: .82rem; opacity: .7; margin: 24px 0 0; }`;

// Genera la reseña pública como HTML estático (sin JavaScript), para pegar en
// un bloque «HTML personalizado» de WordPress. opts.obras limita a esas obras.
function bloqueWordpress(res, cfg, lang, opts = {}) {
  const t = TXT_BLOQUE[lang], pub = cfg.publicacion;
  const preguntas = pub.preguntas_publicas || cfg.nota_obra;
  const obras = res.obras.filter(o => o.n >= pub.min_respuestas_obra && o.nota !== null && (!opts.obras || opts.obras.includes(o.id)));
  const tarjetas = obras.map(o => {
    const img = o.imagen ? `<img src="${esc(o.imagen)}" alt="${esc(o[lang])}" loading="lazy">` : "";
    const barras = preguntas.filter(g => o.preguntas[g].media !== null).map(g => {
      const m = o.preguntas[g].media;
      return `<li><span>${esc(cfg.preguntas[g][lang])}</span><b>${fmt(m)}</b><span class="txalo-barra"><i style="width:${Math.round(m * 10)}%"></i></span></li>`;
    }).join("");
    return `<article class="txalo-obra">
<div class="txalo-irudia">${img}<h4 class="txalo-izena">${esc(o[lang])}</h4>
<div class="txalo-nota">${svgLogoLiquido(o.nota)}<span>${fmt(o.nota)}<small>/ 10</small></span></div></div>
<div class="txalo-gorputza"><div class="txalo-datuak"><span class="txalo-txip">${t.resp(o.n)}</span><span class="txalo-txip gorria">${t.pct(o.pct_recomendaria)}</span></div>
<ul class="txalo-barrak">${barras}</ul></div>
</article>`;
  }).join("\n");
  const cabecera = opts.sinCabecera ? "" : `<h3 class="txalo-izenburua">${t.titulo}</h3>\n<p class="txalo-azpi">${t.sub}</p>\n`;
  return `<!-- Txalometroa · generado el ${fechaHora(res.generado)}. No lo edites a mano: vuelve a generarlo y pégalo entero. -->
<style>${CSS_BLOQUE}
</style>
<div class="txalo-emaitzak" lang="${lang}">
${cabecera}<div class="txalo-lista">
${tarjetas}
</div>
<p class="txalo-pie">${t.act(fecha(res.hasta))}</p>
</div>`;
}

// ---------------------------------------------------------------- Alta de obras desde el export

// Por cada nombre de obra del export: respuestas, idioma predominante y días con respuestas.
function infoNombres(filas) {
  const info = {};
  for (const f of filas) {
    const n = String(f.PRODUKZIOA ?? "").trim(); if (!n) continue;
    const i = info[n] ||= { n: 0, eu: 0, es: 0, dias: new Set() };
    i.n++;
    const h = String(f.HIZKUNTZA ?? "").trim().toLowerCase();
    if (h === "eu" || h === "es") i[h]++;
    const d = parsearFecha(f.NOIZ); if (d) i.dias.add(fecha(d));
  }
  for (const i of Object.values(info)) i.idioma = i.eu > i.es ? "eu" : "es";
  return info;
}

// Si dos nombres en idiomas distintos reciben respuestas los mismos días, lo más
// probable es que sean la misma obra (versión eu y versión es). Puntuación: parte
// de los días del nombre con menos días que coinciden con el otro. Se empareja de
// mayor a menor puntuación, cada nombre una sola vez. Devuelve { i: j } con j < i.
function emparejar(nombres, info) {
  const pares = [];
  for (let i = 0; i < nombres.length; i++) for (let j = 0; j < i; j++) {
    const a = info[nombres[i]], b = info[nombres[j]];
    if (!a || !b || a.idioma === b.idioma) continue;
    const comunes = [...a.dias].filter(d => b.dias.has(d)).length;
    const p = comunes / Math.min(a.dias.size, b.dias.size);
    if (comunes && p >= 0.35) pares.push({ i, j, p });
  }
  const usado = new Set(), res = {};
  for (const { i, j } of pares.sort((x, y) => y.p - x.p)) {
    if (usado.has(i) || usado.has(j)) continue;
    usado.add(i); usado.add(j); res[i] = j;
  }
  return res;
}

// Tabla para decidir, por cada nombre nuevo del export, si es una obra nueva o la
// misma que otra. Los controles llevan id nueva-<i> y foto-<i>.
function htmlTablaObrasNuevas(nombres, cfg, filas) {
  const info = infoNombres(filas), parejas = emparejar(nombres, info);
  const filasHtml = nombres.map((n, i) => {
    const sug = parejas[i] ?? null;
    const opciones = [`<option value="nueva">Una obra nueva</option>`,
      ...Object.entries(cfg.obras).map(([id, o]) => `<option value="id:${esc(id)}">La misma que «${esc(o.es)}»</option>`),
      ...nombres.slice(0, i).map((m, j) => `<option value="n:${j}" ${j === sug ? "selected" : ""}>La misma que «${esc(m)}»${j === sug ? " (sugerido)" : ""}</option>`)];
    return `<tr><td><b>${esc(n)}</b></td><td class="num">${info[n]?.n ?? 0}</td><td>${info[n]?.idioma ?? "–"}</td>
      <td><select id="nueva-${i}" aria-label="Qué es «${esc(n)}»">${opciones.join("")}</select>${sug !== null ? `<span class="sugerido">Mismas fechas que «${esc(nombres[sug])}»</span>` : ""}</td>
      <td><input id="foto-${i}" type="url" aria-label="Foto de «${esc(n)}»" placeholder="https://…/foto.jpg (opcional)"></td></tr>`;
  }).join("");
  return `<table class="nuevas"><tr><th>Nombre en el export</th><th>Respuestas</th><th>Idioma</th><th>Es…</th><th>Foto</th></tr>${filasHtml}</table>`;
}

// Lee las decisiones de la tabla anterior y crea o amplía las obras en cfg.
function aplicarObrasNuevas(cfg, nombres, filas) {
  const info = infoNombres(filas);
  const valor = i => document.getElementById(`nueva-${i}`).value;
  const foto = i => document.getElementById(`foto-${i}`).value.trim();
  const idDe = {};
  nombres.forEach((n, i) => {
    if (valor(i) !== "nueva") return;
    let id = slug(n) || "obra", k = 2;
    while (cfg.obras[id]) id = `${slug(n) || "obra"}-${k++}`;
    cfg.obras[id] = { eu: n, es: n, alias: [n], imagen: foto(i) };
    idDe[i] = id;
  });
  const destino = i => { const v = valor(i); return v === "nueva" ? idDe[i] : v.startsWith("id:") ? v.slice(3) : destino(+v.slice(2)); };
  nombres.forEach((n, i) => {
    if (valor(i) === "nueva") return;
    const o = cfg.obras[destino(i)];
    if (!o.alias.includes(n)) o.alias.push(n);
    o[info[n]?.idioma ?? "es"] = n;
    if (!o.imagen && foto(i)) o.imagen = foto(i);
  });
  return cfg;
}

// Máscara de teatro. k: -1 (drama) … 1 (comedia). relleno: 0–1 (parte roja, de izquierda a derecha).
let idMascara = 0;
function svgMascara(k, relleno = 1, opts = {}) {
  const id = `msk${++idMascara}`;
  const sube = k;                       // >0 sonríe, <0 llora
  // Boca: comisuras arriba (comedia) o abajo (drama); la abertura se agranda en los extremos.
  const cy = 76 - 7 * sube, abre = 6 + 8 * Math.abs(k);
  const boca = sube >= 0
    ? `M28 ${cy} Q50 ${cy + 4 + abre * 1.6} 72 ${cy} Q50 ${cy + 6} 28 ${cy} Z`
    : `M28 ${cy} Q50 ${cy - 6 - abre * 1.3} 72 ${cy} Q50 ${cy - 2} 28 ${cy} Z`;
  // Ojos: media luna feliz o caída triste.
  const ojo = (x, lado) => {
    const caida = -sube * 5 * lado;      // la esquina exterior cae en drama
    return sube >= 0
      ? `M${x - 10} ${44 + 2} Q${x} ${32 + 2 - 6 * sube} ${x + 10} ${44 + 2} Q${x} ${40 + 2} ${x - 10} ${44 + 2} Z`
      : `M${x - 10} ${42 + (lado < 0 ? -caida : 0)} Q${x} ${50} ${x + 10} ${42 + (lado > 0 ? caida : 0)} Q${x} ${34} ${x - 10} ${42 + (lado < 0 ? -caida : 0)} Z`;
  };
  // Cejas: arqueadas (comedia) o con la parte interior levantada (drama).
  const ceja = (x, lado) => {
    const int = x + (lado < 0 ? 9 : -9), ext = x + (lado < 0 ? -11 : 11);
    const yInt = 27 - Math.max(0, -sube) * 7, yExt = 27 + Math.max(0, -sube) * 3;
    return `M${ext} ${yExt} Q${x} ${21 - 3 * Math.max(0, sube)} ${int} ${yInt}`;
  };
  const cara = "M50 4 C78 4 95 14 95 40 C95 70 80 101 50 106 C20 101 5 70 5 40 C5 14 22 4 50 4 Z";
  const agujeros = `${ojo(32, -1)} ${ojo(68, 1)} ${boca}`;
  const capa = (fondo, borde, sombra) => `
    <path d="${cara} ${agujeros}" fill-rule="evenodd" fill="${fondo}" stroke="${borde}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${ceja(32, -1)} ${ceja(68, 1)}" fill="none" stroke="${sombra}" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg class="mascara" viewBox="-2 0 104 110" aria-hidden="true">
  <defs>
    <linearGradient id="${id}-r" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#ef5a4f"/><stop offset=".55" stop-color="#d0322a"/><stop offset="1" stop-color="#9f1d17"/></linearGradient>
    <linearGradient id="${id}-c" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#ecd29b"/></linearGradient>
    <clipPath id="${id}-m"><rect x="-2" y="0" width="${(104 * relleno).toFixed(1)}" height="110"/></clipPath>
  </defs>
  ${opts.vacia === false ? "" : capa(`url(#${id}-c)`, "#cfae6c", "#b8955a")}
  <g clip-path="url(#${id}-m)">${capa(`url(#${id}-r)`, "#7d1712", "#7d1712")}
    <path d="M30 14 C40 9 60 9 70 14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4" stroke-linecap="round"/></g>
</svg>`;
}

const CATALOGO_BASE = CATALOGO.obras, OBRAS_CFG_BASE = { ...CFG.obras };
const NOMBRES_PRUEBA = [["Ilargiaren lapurra", "El ladrón de la luna"], ["Gaueko ateak", "Las puertas de la noche"], ["Itsas argia", "Luz de mar"],
  ["Hamaika ispilu", "Once espejos"], ["Zuhaitz hutsa", "El árbol vacío"], ["Etxe txikia", "La casa pequeña"], ["Haizearen alaba", "La hija del viento"], ["Azken trena", "El último tren"]];

function aplicarPruebas() {

  CFG.obras = { ...OBRAS_CFG_BASE };
  for (const { obra: o } of G.pruebak) CFG.obras[o.id] = { eu: o.eu, es: o.es, alias: [...new Set([o.eu, o.es])], imagen: o.imagen };
  cacheRes = null;
}

// Cartel generado: degradado del color del género, la A de Hika y el título.
function cartelPrueba(titulo, genero, r) {
  const col = genKolorea(genero), giro = Math.round(r() * 60 - 30);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="#1a1a1a"/></linearGradient></defs>
    <rect width="800" height="600" fill="url(#g)"/><g transform="translate(330 40) rotate(${giro} 200 190) scale(1.3)" opacity=".35"><path d="${LOGO.negro}" fill="#0d0d0d"/><path d="${LOGO.rojo} ${LOGO.hueco}" fill="#fffdf0" fill-rule="evenodd"/></g>
    <text x="40" y="520" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#fffdf0">${esc(titulo)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function crearPruebas(cuantas = 4) {
  const r = azarra(Date.now()), gauss = () => Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(2 * Math.PI * r());
  const libres = NOMBRES_PRUEBA.filter(([eu]) => !G.pruebak.some(p => p.obra.eu === eu));
  for (const [eu, es] of libres.slice(0, cuantas)) {
    const id = `proba-${slug(eu)}`, genero = GEN_ORDEN[Math.floor(r() * GEN_ORDEN.length)], nivel = 6.6 + r() * 3.1, filas = [];
    const funciones = 2 + Math.floor(r() * 4);
    for (let f = 0; f < funciones; f++) {
      const dia = new Date(Date.now() - Math.floor(r() * 240) * 86400000); dia.setHours(21, Math.floor(r() * 50), 0, 0);
      const n = 4 + Math.floor(r() * 16);
      for (let k = 0; k < n; k++) {
        const cuando = new Date(dia.getTime() + k * (20 + Math.floor(r() * 70)) * 1000), lang = r() < .4 ? "eu" : "es";
        const nota = () => Math.max(1, Math.min(10, Math.round(nivel + gauss() * 1.2)));
        filas.push({ ID: `p-${id}-${f}-${k}`, PRODUKZIOA: lang === "eu" ? eu : es, HIZKUNTZA: lang,
          NOIZ: `${cuando.getFullYear()}-${dd(cuando.getMonth() + 1)}-${dd(cuando.getDate())} ${dd(cuando.getHours())}:${dd(cuando.getMinutes())}:${dd(cuando.getSeconds())}`,
          GAL1: nota(), GAL2: nota(), GAL3: nota(), GAL4: nota(), GAL5: r() < .8 ? nota() : 0, GAL6: r() < .8 ? nota() : 0, GAL7: r() < .7 ? nota() : 0 });
      }
    }
    G.pruebak.push({ obra: { id, eu, es, urtea: 2026, genero, txalometroa: id, imagen: cartelPrueba(eu, genero, r), proba: true }, filas });
  }
  guardar(); aplicarPruebas();
}

function borrarPrueba(id) {
  G.pruebak = G.pruebak.filter(p => p.obra.id !== id);
  G.valoraciones = G.valoraciones.filter(v => v.obra !== id);
  guardar(); aplicarPruebas();
}
function borrarPruebas() {
  const ids = new Set(G.pruebak.map(p => p.obra.id));
  G.pruebak = []; G.valoraciones = G.valoraciones.filter(v => !ids.has(v.obra));
  guardar(); aplicarPruebas();
}

// ================================================================ Cálculos

// Valoraciones propias de obras activas, en el formato del export, para sumarlas al público.
function misFilas() {
  return G.valoraciones.filter(v => !v.demo).map(v => {
    const o = obraCat(v.obra); if (!o?.txalometroa || !CFG.obras[o.txalometroa]) return null;
    const d = new Date(v.fecha);
    return { ID: v.id, PRODUKZIOA: CFG.obras[o.txalometroa][v.lang || "eu"], NOIZ: `${d.getFullYear()}-${dd(d.getMonth() + 1)}-${dd(d.getDate())} ${dd(d.getHours())}:${dd(d.getMinutes())}:${dd(d.getSeconds())}`, HIZKUNTZA: v.lang || "eu", ...v.notas };
  }).filter(Boolean);
}
let cacheRes = null;
function publico() {
  if (!cacheRes) cacheRes = analizar([...EXPORT, ...G.pruebak.flatMap(p => p.filas), ...misFilas()], CFG);
  return cacheRes;
}
const publicoDe = o => o?.txalometroa ? publico().obras.find(x => x.id === o.txalometroa) || null : null;
const notaPropia = v => { const xs = CFG.nota_obra.map(g => v.notas[g]).filter(x => x); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
// Última valoración de cada obra (la constelación tiene una estrella por obra).
function misObras() {
  const m = new Map();
  for (const v of [...G.valoraciones].sort((a, b) => a.fecha.localeCompare(b.fecha))) m.set(v.obra, v);
  return [...m.values()].filter(v => obraCat(v.obra) && notaPropia(v) !== null);
}

// Generador pseudoaleatorio con semilla (mismo dibujo cada vez).
function azarra(semilla) {
  let a = semilla >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x ^= x + Math.imul(x ^ (x >>> 7), 61 | x); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}
const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) >>> 0;

const K_MASCARA = [-1, -0.5, 0, 0.5, 1];

function htmlNeurgailua(nota, etiketa, clase = "") {
  return `<div class="neurgailua ${clase}">${svgLogoLiquido(nota)}<div class="zbk">${fmt(nota)}<small>/10</small></div>${etiketa ? `<div class="zer">${etiketa}</div>` : ""}</div>`;
}
// Medida 0–10 dibujada con 5 máscaras rellenas en parte (de drama a comedia).
function htmlMaskaraNeurria(v) {
  return `<div class="maskara-neurria" aria-hidden="true">${K_MASCARA.map((k, i) => svgMascara(k, Math.max(0, Math.min(1, (v ?? 0) / 2 - i)))).join("")}</div>`;
}
// Máscara de teatro dorada para valorar (diseño de Hika): k va de la tragedia (-1) a la comedia (1).
// Debajo, la máscara en gris; encima, la dorada recortada según «relleno» (0, media o entera).
let idUrrea = 0;
function svgMaskaraUrrea(k, relleno = 0) {
  const id = `mu${++idUrrea}`, triste = Math.max(0, -k), alegre = Math.max(0, k);
  const cara = "M9 22 C8 10 17 5 28 7 C38 9 44 13 50 12 C56 11 63 7 74 6 C85 5 93 11 92 23 C92 41 90 60 85 77 C78 98 65 116 50 120 C35 116 22 98 15 78 C10 61 8 41 9 22 Z";
  // Ojos en media luna: en la tragedia caen hacia fuera; en la comedia se arquean.
  const ojo = lado => {
    const x0 = 50 + lado * 6, x1 = 50 + lado * 34, yIn = 49 - triste * 3, yOut = 50 + triste * 6;
    const arriba = 35 - alegre * 3, abajo = 53 - alegre * 9;
    return `M${x1} ${yOut} Q${50 + lado * 19} ${arriba} ${x0} ${yIn} Q${50 + lado * 19} ${abajo} ${x1} ${yOut} Z`;
  };
  // Cejas en relieve que bajan hasta la nariz.
  const ceja = lado => `M${50 + lado * 34} ${39 + triste * 3 - alegre * 2} Q${50 + lado * 26} ${24 - alegre * 3 + triste * 2} ${50 + lado * 9} ${30 - triste * 5} Q${50 + lado * 3} ${44} ${50 + lado * 4} ${64}`;
  const BOCAK = {
    "-1": "M29 104 Q50 74 71 104 Q50 90 29 104 Z", "-0.5": "M32 99 Q50 83 68 99 Q50 92 32 99 Z", "0": "M33 93 Q50 89 67 93 Q50 99 33 93 Z",
    "0.5": "M31 88 Q50 103 69 88 Q50 96 31 88 Z", "1": "M27 84 Q50 116 73 84 Q50 96 27 84 Z"
  };
  const capa = (c, n) => `
    <path d="${cara}" fill="url(#${id}-${n})" stroke="${c.borde}" stroke-width="3.2" stroke-linejoin="round"/>
    ${c.mejilla ? `<ellipse cx="28" cy="76" rx="13" ry="10" fill="${c.mejilla}" opacity="${.2 + alegre * .3}" filter="url(#${id}-b)"/><ellipse cx="72" cy="76" rx="13" ry="10" fill="${c.mejilla}" opacity="${.2 + alegre * .3}" filter="url(#${id}-b)"/>` : ""}
    <path d="${ceja(-1)} ${ceja(1)}" fill="none" stroke="${c.relieve}" stroke-width="3.6" stroke-linecap="round" filter="url(#${id}-b)"/>
    <path d="${ojo(-1)} ${ojo(1)} ${BOCAK[k]}" fill="${c.hueco}"/>
    <path d="M42 75 Q39 68 45 68 Q47 73 50 73 Q53 73 55 68 Q61 68 58 75" fill="none" stroke="${c.nariz}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M49 60 L49 70" stroke="${c.nariz}" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>`;
  const GRIS = { borde: "#4b4b4b", mejilla: null, relieve: "rgba(255,255,255,.28)", hueco: "#a9a9a9", nariz: "#5a5a5a" };
  const URREA = { borde: "#b6953c", mejilla: "#e8b93a", relieve: "rgba(255,248,214,.7)", hueco: "#fde9a6", nariz: "#c9a341" };
  return `<svg class="mascara urrea" viewBox="0 0 101 126" aria-hidden="true">
  <defs>
    <radialGradient id="${id}-g" cx=".5" cy=".55" r=".65"><stop offset="0" stop-color="#8d8d8d"/><stop offset="1" stop-color="#666"/></radialGradient>
    <radialGradient id="${id}-u" cx=".5" cy=".6" r=".65"><stop offset="0" stop-color="#ffdc5e"/><stop offset=".7" stop-color="#f6cb47"/><stop offset="1" stop-color="#e8bb3c"/></radialGradient>
    <filter id="${id}-b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".8"/></filter>
    <filter id="${id}-d" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#ffd95a" flood-opacity=".55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="${id}-m"><rect x="0" y="0" width="${(101 * relleno).toFixed(1)}" height="126"/></clipPath>
  </defs>
  ${capa(GRIS, "g")}
  ${relleno > 0 ? `<g filter="url(#${id}-d)"><g clip-path="url(#${id}-m)">${capa(URREA, "u")}</g></g>` : ""}
</svg>`;
}
// Entrada con máscaras: media máscara = 1 punto, entera = 2. «antes» marca las que acaban de dorarse.
function htmlMaskarak(g, valor, etiqueta, antes = valor) {
  const relleno = (v, i) => Math.max(0, Math.min(1, v / 2 - i));
  return `<div class="maskarak" role="slider" tabindex="0" aria-label="${esc(etiqueta)}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${valor}" data-preg="${g}">
    ${K_MASCARA.map((k, i) => `<button type="button" tabindex="-1" data-i="${i + 1}" aria-hidden="true"${relleno(valor, i) > relleno(antes, i) ? ' class="piztu"' : ""}>${svgMaskaraUrrea(k, relleno(valor, i))}</button>`).join("")}
    <output class="${valor ? "jarrita" : ""}">${valor || "–"}</output></div>`;
}

const VISTAS = ["obrak", "jarioa", "butakak", "konst", "wrapped"];
let vista = { nombre: "obrak" };

function pintarNav() {

function vistaObrak() {
  const tx = t();
  const tarjetas = activas().sort((a, b) => b.urtea - a.urtea).map(o => {

        <h2 class="izena">${esc(izena(o))}</h2>${p ? htmlNeurgailua(p.nota) : ""}</div>

      <div class="testua"><b>${esc(izena(o))}</b><span>${o.urtea} · ${esc(genIzena(o.genero))}</span></div></button>`).join("");
  return `${bandaDemo()}${htmlZuzenean()}<h1 class="titulua">${tx.orain}</h1><p class="azalpena">${tx.orainAzal}</p>

    <h2 class="azpititulua">${tx.errep}</h2><p class="azalpena">${tx.errepAzal}</p>
    <div class="errepertorioa">${errep}</div>`;
}

function vistaFitxa(id) {
  const tx = t(), o = obraCat(id), p = publicoDe(o), mia = misObras().find(v => v.obra === id);

    : `<p class="azalpena">${tx.datuGabe}</p>`;
  const miaHtml = mia ? `<div class="zurea"><h3>${tx.zureTxaloa}: ${fmt(notaPropia(mia))}</h3>${htmlMaskaraNeurria(notaPropia(mia))}
      <p>${tx.noiz(fecha(new Date(mia.fecha)))}${mia.emozioa && mia.emozioa !== "ez" ? ` · ${tx.emozioak[mia.emozioa]}` : ""}</p>

  return `<div class="fitxa-azala"><img src="${esc(o.imagen)}" alt=""><button type="button" class="atzera" data-vista="obrak" aria-label="${tx.atzera}">${ICONOS.atzera}</button><h1>${esc(izena(o))}</h1></div>

    ${publicoHtml}${miaHtml}
    <div class="ekintza"><button type="button" class="botoia zabala" data-baloratu="${o.id}">${mia ? tx.berriroBaloratu : (o.txalometroa ? tx.txalotu : tx.ikusiDut)}</button></div>`;
}

function bandaDemo() {
  return G.valoraciones.some(v => v.demo) ? `<div class="demo-banda"><span>${t().adibideBanda}</span><button type="button" data-demo="kendu">${t().kendu}</button></div>` : "";
}

function pintar() {
  pintarNav();
  const main = document.getElementById("edukia");
  pararZerua(); SARE.txanda++;
  if (vista.nombre === "fitxa") main.innerHTML = vistaFitxa(vista.obra);
  else if (vista.nombre === "jarioa") { main.innerHTML = vistaJarioa(); if (sareaPrest()) hasiJarioa(); }
  else if (vista.nombre === "profila") { main.innerHTML = vistaProfila(); if (sareaPrest()) hasiProfila(); }
  else if (vista.nombre === "butakak") main.innerHTML = vistaButakak();
  else if (vista.nombre === "konst") { main.innerHTML = vistaKonst(); hasiZerua(); }
  else if (vista.nombre === "wrapped") main.innerHTML = vistaWrapped();
  else main.innerHTML = vistaObrak();
}
function irA(nombre, extra = {}) {
  vista = { nombre, ...extra };
  const marca = nombre === "fitxa" ? `obra-${extra.obra}` : nombre === "profila" && extra.usuario ? `profila-${extra.usuario}` : nombre;
  try { history.replaceState(null, "", `#${marca}`); } catch (e) {}
  pintar(); window.scrollTo(0, 0);
}

// ================================================================ Valorar

let baloraketa = null;   // { obra, urratsa, notas, testuak }
// La opinión libre; las valoraciones antiguas guardaban varias respuestas (personaje favorito…).
const iritziaDe = v => v.testuak?.iritzia || v.testuak?.pertsonaia || "";

function abrirValorar(id) {
  baloraketa = { obra: id, urratsa: 0, notas: Object.fromEntries(PREG.map(g => [g, 0])), testuak: {} };
  const el = document.getElementById("baloratu"); el.hidden = false; document.body.style.overflow = "hidden";
  pintarValorar();
}
function cerrarValorar() {
  document.getElementById("baloratu").hidden = true; document.body.style.overflow = ""; baloraketa = null;
}

function pintarValorar() {
  const tx = t(), b = baloraketa, o = obraCat(b.obra), el = document.getElementById("baloratu");
  if (b.urratsa === 2) return pintarResultado();
  const pasos = `<div class="urratsak">${[0, 1].map(i => `<i class="${i <= b.urratsa ? "eginda" : ""}"></i>`).join("")}</div>`;
  let cuerpo = "";
  if (b.urratsa === 0) {
    const principales = CFG.nota_obra, resto = PREG.filter(g => !principales.includes(g) && (o.txalometroa || CFG.preguntas[g].bloque !== "localidad"));
    const fila = g => `<div class="galdera"><p class="testua">${esc(CFG.preguntas[g]["texto_" + G.lang])}</p>${htmlMaskarak(g, b.notas[g], CFG.preguntas[g]["texto_" + G.lang])}</div>`;
    cuerpo = `<h2>${esc(izena(o))}</h2><p class="azalpena">${tx.notakAzal}</p>${principales.map(fila).join("")}
      <details class="gehiago"><summary>${tx.gehiago} (${resto.length})</summary>${resto.map(fila).join("")}</details>
      <p class="oharra" id="oharra" aria-live="polite"></p>`;
  } else {
    cuerpo = `<h2>${tx.urratsa[1]}</h2><p class="azalpena">${tx.iritziAzal}</p>
      <textarea class="iritzia" data-testua="iritzia" maxlength="1500" aria-label="${tx.iritzia}" placeholder="${tx.iritziaIdatzi}">${esc(b.testuak.iritzia || "")}</textarea>`;
  }
  el.innerHTML = `<div class="goia"><button type="button" class="atzera" data-bal="itxi" aria-label="${tx.atzera}">${ICONOS.itxi}</button>${pasos}</div>
    <div class="edukia">${cuerpo}</div>
    <div class="beheko">${b.urratsa > 0 ? `<button type="button" class="botoia marino" data-bal="atzera">${tx.atzera}</button>` : ""}
      <button type="button" class="botoia" data-bal="${b.urratsa === 1 ? "bidali" : "hurrengoa"}" id="bal-aurrera">${b.urratsa === 1 ? tx.bidali : tx.hurrengoa}</button></div>`;
  el.scrollTop = 0;
}
function ponerNota(g, v, teclado = false) {
  const antes = baloraketa.notas[g];
  baloraketa.notas[g] = Math.max(0, Math.min(10, v));
  const cont = document.querySelector(`.maskarak[data-preg="${g}"]`);
  cont.outerHTML = htmlMaskarak(g, baloraketa.notas[g], CFG.preguntas[g]["texto_" + G.lang], antes);
  if (teclado) document.querySelector(`.maskarak[data-preg="${g}"]`).focus({ preventScroll: true });
  const o = document.getElementById("oharra"); if (o) o.textContent = "";
}

function enviarValoracion() {
  const b = baloraketa, o = obraCat(b.obra);
  const boton = document.getElementById("bal-aurrera"); boton.disabled = true; boton.textContent = t().bidaltzen;
  const antes = publicoDe(o);
  const notas = Object.fromEntries(PREG.map(g => [g, b.notas[g] || 0]));
  G.valoraciones = G.valoraciones.filter(v => !(v.demo && v.obra === b.obra));
  G.valoraciones.push({ id: `m-${Date.now()}`, obra: b.obra, fecha: new Date().toISOString(), lang: G.lang, notas,
    emozioa: "ez", testuak: Object.fromEntries(Object.entries(b.testuak).filter(([, x]) => x.trim())) });
  const nueva = G.valoraciones[G.valoraciones.length - 1];
  b.partekatu = !sareaPrest() || !partekagarria(nueva) ? null : haySesion() ? "zain" : "sartu";
  if (b.partekatu === "zain") {
    nueva.sare = "zain";
    argitaratu(nueva).then(() => "bai", () => "errorea").then(egoera => {
      if (baloraketa !== b) return;
      b.partekatu = egoera; const el = document.getElementById("partekatu-egoera"); if (el) el.textContent = egoera === "bai" ? t().partekatuta : t().partekatuEzin;
    });
  }
  guardar(); cacheRes = null;
  b.antes = antes; b.urratsa = 2;
  setTimeout(() => { pintarValorar(); konfetia(); }, 350);
}

function pintarResultado() {
  const tx = t(), b = baloraketa, o = obraCat(b.obra), mia = misObras().find(v => v.obra === b.obra), p = publicoDe(o);
  document.getElementById("baloratu").innerHTML = `<div class="goia"><button type="button" class="atzera" data-bal="itxi" aria-label="${tx.atzera}">${ICONOS.itxi}</button></div>
    <div class="edukia emaitza">

// Posición: ángulo según el género, distancia al centro según la nota, tamaño según la emoción.
function calcularNodos(ancho, alto) {
  const mias = misObras(), cx = ancho / 2, cy = alto / 2, R = Math.min(ancho, alto) * .4;
  const porGenero = {};
  mias.forEach(v => { const g = obraCat(v.obra).genero; (porGenero[g] ||= []).push(v); });
  const sector = Math.PI * 2 / GEN_ORDEN.length;
  return mias.map(v => {
    const o = obraCat(v.obra), g = o.genero, lista = porGenero[g], j = lista.indexOf(v);
    const ang = GEN_ORDEN.indexOf(g) * sector - Math.PI / 2 + (j - (lista.length - 1) / 2) * Math.min(.34, sector * .8 / Math.max(1, lista.length - 1));
    const nota = notaPropia(v), dist = R * (.18 + .82 * (1 - (nota - 1) / 9));
    const emo = { ez: 0, barre: 2, negar: 2, biak: 4 }[v.emozioa] || 0, txt = Object.keys(v.testuak || {}).length;
    return { v, o, g, nota, x: cx + Math.cos(ang) * dist, y: cy + Math.sin(ang) * dist, r: 4 + emo + txt * .7, color: genKolorea(g), fecha: v.fecha };
  });
}
function calcularLineas(ns) {
  const lineas = [];
  const crono = [...ns].sort((a, b) => a.fecha.localeCompare(b.fecha));
  for (let i = 1; i < crono.length; i++) lineas.push({ a: crono[i - 1], b: crono[i], tipo: "denbora" });
  for (const n of ns) {
    const mismos = ns.filter(m => m !== n && m.g === n.g);
    if (!mismos.length) continue;
    const cerca = mismos.reduce((a, b) => Math.hypot(a.x - n.x, a.y - n.y) < Math.hypot(b.x - n.x, b.y - n.y) ? a : b);
    if (!lineas.some(l => (l.a === n && l.b === cerca) || (l.a === cerca && l.b === n))) lineas.push({ a: n, b: cerca, tipo: "genero" });
  }
  return lineas;
}

function hasiZerua() {
  const canvas = document.getElementById("zerua"); if (!canvas) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), ancho = canvas.parentElement.clientWidth, alto = Math.round(ancho * 1.05);
  canvas.width = ancho * dpr; canvas.height = alto * dpr; canvas.style.height = `${alto}px`;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  nodos = calcularNodos(ancho, alto);
  const lineas = calcularLineas(nodos), r = azarra(7);
  const fondo = Array.from({ length: 140 }, () => ({ x: r() * ancho, y: r() * alto, s: r() * 1.2 + .2, f: r() * 6 }));
  const cx = ancho / 2, cy = alto / 2, R = Math.min(ancho, alto) * .4, sector = Math.PI * 2 / GEN_ORDEN.length;
  const inicio = performance.now(), reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const orden = [...nodos].sort((a, b) => a.fecha.localeCompare(b.fecha));
  function marco(ahora) {
    const tt = reducido ? 99 : (ahora - inicio) / 1000;
    ctx.clearRect(0, 0, ancho, alto);
    for (const s of fondo) { ctx.globalAlpha = .25 + .25 * Math.sin(tt * 1.4 + s.f); ctx.fillStyle = "#fffdf0"; ctx.fillRect(s.x, s.y, s.s, s.s); }
    ctx.globalAlpha = 1;
    // Anillos de nota y sectores de género
    ctx.strokeStyle = "rgba(255,253,240,.08)"; ctx.lineWidth = 1;
    [10, 7, 4].forEach(n => { ctx.beginPath(); ctx.arc(cx, cy, R * (.18 + .82 * (1 - (n - 1) / 9)), 0, Math.PI * 2); ctx.stroke(); });
    ctx.font = "13px 'Jersey 10', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    GEN_ORDEN.forEach((g, i) => {
      const a = i * sector - Math.PI / 2;
      ctx.fillStyle = genKolorea(g); ctx.globalAlpha = .75;
      ctx.fillText(genIzena(g).toUpperCase(), cx + Math.cos(a) * (R + 20), cy + Math.sin(a) * (R + 20));
    });
    ctx.globalAlpha = 1;
    [10, 7, 4].forEach(n => { ctx.fillStyle = "rgba(255,253,240,.35)"; ctx.fillText(String(n), cx + 8, cy - R * (.18 + .82 * (1 - (n - 1) / 9)) - 6); });
    // Núcleo
    const g0 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 26); g0.addColorStop(0, "rgba(253,238,199,.55)"); g0.addColorStop(1, "rgba(253,238,199,0)");
    ctx.fillStyle = g0; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
    // Líneas: se dibujan poco a poco
    for (const l of lineas) {
      const ia = orden.indexOf(l.a), ib = orden.indexOf(l.b), aparece = Math.max(ia, ib) * .35 + .4;
      const p = Math.max(0, Math.min(1, (tt - aparece) / .6)); if (!p) continue;
      ctx.strokeStyle = l.tipo === "denbora" ? "rgba(255,253,240,.38)" : l.a.color; ctx.globalAlpha = l.tipo === "denbora" ? 1 : .55;
      ctx.setLineDash(l.tipo === "genero" ? [3, 4] : []); ctx.lineWidth = l.tipo === "denbora" ? 1.2 : 1;
      ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.a.x + (l.b.x - l.a.x) * p, l.a.y + (l.b.y - l.a.y) * p); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    // Estrellas
    orden.forEach((n, i) => {
      const p = Math.max(0, Math.min(1, (tt - i * .35) / .5)); if (!p) return;
      const brillo = 1 + .12 * Math.sin(tt * 2 + i), rad = n.r * (p < 1 ? 1 + (1 - p) * .8 : brillo);
      const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, rad * 4); halo.addColorStop(0, n.color + "aa"); halo.addColorStop(1, n.color + "00");
      ctx.globalAlpha = p; ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(n.x, n.y, rad * 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fffdf0"; ctx.beginPath(); ctx.arc(n.x, n.y, rad * .55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(n.x, n.y, rad * .35, 0, Math.PI * 2); ctx.fill();
      if (zeruaSel === n) { ctx.strokeStyle = "#fffdf0"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(n.x, n.y, rad + 7, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = "rgba(255,253,240,.85)"; ctx.font = "15px 'Jersey 10', monospace";
      ctx.fillText(izena(n.o), n.x, n.y + rad + 12);
    });
    ctx.globalAlpha = 1;
    zeruaAnim = requestAnimationFrame(marco);
  }
  zeruaAnim = requestAnimationFrame(marco);
  canvas.onclick = e => {
    const b = canvas.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    const cerca = nodos.reduce((m, n) => { const d = Math.hypot(n.x - x, n.y - y); return d < m.d ? { n, d } : m; }, { n: null, d: 36 }).n;

  zeruaSel = null; pintarTarjetaEstrella();
}

let historia = null;
function abrirWrapped(tipo) {
  const diapos = tipo === "mundiala" ? diapositivasMundial() : diapositivasPersonal();
  historia = { diapos, i: 0, timer: null };
  const el = document.getElementById("istorioa"); el.hidden = false; document.body.style.overflow = "hidden";
  el.innerHTML = `<div class="barrak">${diapos.map(() => "<i><b></b></i>").join("")}</div>
    <button type="button" class="itxi" data-istorio="itxi" aria-label="${t().atzera}">${ICONOS.itxi}</button>
    <div class="diapo" id="diapo"></div><button type="button" class="ukitu ezk" data-istorio="aurrekoa" aria-label="${t().atzera}"></button><button type="button" class="ukitu esk" data-istorio="hurrengoa" aria-label="${t().hurrengoa}"></button>`;
  mostrarDiapo(0);
}
function mostrarDiapo(i) {
  const h = historia; if (!h) return;
  if (i >= h.diapos.length) return cerrarWrapped();
  h.i = Math.max(0, i);
  const d = h.diapos[h.i], el = document.getElementById("istorioa"), cont = document.getElementById("diapo");
  el.style.background = d.bg; cont.style.color = d.c; cont.innerHTML = d.html;
  el.querySelectorAll(".barrak i").forEach((b, k) => { b.className = k < h.i ? "ikusita" : k === h.i ? "oraingoa" : ""; b.querySelector("b").style.animation = "none"; void b.offsetWidth; b.querySelector("b").style.animation = ""; });
  cont.querySelectorAll("[data-kontatu]").forEach(n => contar(n, +n.dataset.kontatu));
  if (cont.querySelector("#mini-zerua")) dibujarMiniZerua(cont.querySelector("#mini-zerua"));
  clearTimeout(h.timer); h.timer = setTimeout(() => mostrarDiapo(h.i + 1), 6000);
}
function contar(nodo, fin) {
  const ini = performance.now(), dur = 1300;
  (function paso(ahora) { const p = Math.min(1, (ahora - ini) / dur); nodo.textContent = Math.round(fin * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(paso); })(ini);
}
function cerrarWrapped() {
  if (historia) clearTimeout(historia.timer); historia = null;
  const el = document.getElementById("istorioa"); el.hidden = true; el.innerHTML = ""; document.body.style.overflow = "";
}
function dibujarMiniZerua(canvas) {
  const lado = canvas.clientWidth || 300, dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = lado * dpr; canvas.height = lado * dpr; const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const ns = calcularNodos(lado, lado), ls = calcularLineas(ns);
  ctx.strokeStyle = "rgba(255,253,240,.5)"; ls.forEach(l => { ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke(); });
  ns.forEach(n => { ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * .7, 0, Math.PI * 2); ctx.fill(); });
}

const SB = CFG.supabase || {};
const sareaPrest = () => !!(SB.url && SB.anon);
const SB_CLIENTE = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js";
const SB_SAIOA = "txalometroa-saioa";
const KOLOREAK = ["#c80000", "#c8361b", "#0b0a3a", "#2f6b2a", "#6b3fa0", "#8a5a00"];
// perfil: undefined = sin cargar, null = cuenta sin perfil. iritziak: tarjetas en pantalla, por id.
const SARE = { sb: null, kargatzen: null, saioa: null, perfil: undefined, txanda: 0, iritziak: new Map(), azkena: null, ezabatuArmatua: null, kontuaArmatua: false };

function sareaKargatu() {
  if (SARE.sb) return Promise.resolve(SARE.sb);
  return SARE.kargatzen ||= new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = SB_CLIENTE; s.async = true;
    s.onload = () => {
      try {
        SARE.sb = window.supabase.createClient(SB.url, SB.anon, { auth: { persistSession: true, autoRefreshToken: true, storageKey: SB_SAIOA } });
        // Aquí solo se apunta el cambio: llamar a Supabase dentro de este aviso puede bloquear el cliente.
        SARE.sb.auth.onAuthStateChange((ev, saioa) => {
          SARE.saioa = saioa;
          if (!saioa) { SARE.perfil = undefined; pintarProfilaBotoia(); }
        });
        ok(SARE.sb);
      } catch (e) { ko(e); }
    };
    s.onerror = () => { SARE.kargatzen = null; s.remove(); ko(new Error("sarea")); };
    document.head.appendChild(s);
  });
}
// Cliente, sesión guardada y mi perfil.
async function sareaHasi() {
  const sb = await sareaKargatu();
  const { data, error } = await sb.auth.getSession();
  if (error) throw error;
  SARE.saioa = data.session;
  if (SARE.saioa && SARE.perfil === undefined) await nirePerfilaKargatu();
  return sb;
}
async function nirePerfilaKargatu() {
  const { data, error } = await SARE.sb.from("perfiles").select("id, usuario, nombre, bio, color, rol").eq("id", SARE.saioa.user.id).maybeSingle();
  if (error) throw error;
  SARE.perfil = data;
  pintarProfilaBotoia();
  if (data) sinkronizatu();
}

// Pasos comunes: cliente, sesión y perfil. Devuelve el contenedor si la vista sigue en pantalla y hay perfil.
async function sareaPrestatu(txanda) {
  const kont = () => SARE.txanda === txanda ? document.getElementById("sare-edukia") : null;
  try { await sareaHasi(); } catch (e) { if (kont()) kont().innerHTML = htmlSareErrorea(e); return null; }
  if (!kont()) return null;
  if (!SARE.saioa) { kont().innerHTML = htmlSarrera(); return null; }
  if (!SARE.perfil) { kont().innerHTML = htmlPerfilForm(); return null; }
  return kont();
}

// Lista de valoraciones (feed o perfil) con «Cargar más».
async function iritziakKargatu(iragazkia, berria, txanda = SARE.txanda) {
  const kont = document.getElementById("iritziak"); if (!kont) return;
  if (berria) { SARE.iritziak.clear(); SARE.azkena = null; SARE.iragazkia = iragazkia; }
  const { data, error } = await SARE.sb.rpc("muro", { ...SARE.iragazkia, antes: SARE.azkena, limite: 20 });
  if (SARE.txanda !== txanda) return;
  document.getElementById("gehiago")?.remove();
  if (error) { if (berria) kont.innerHTML = htmlSareErrorea(error); return; }
  if (berria) kont.innerHTML = "";
  data.forEach(v => SARE.iritziak.set(String(v.id), v));
  kont.insertAdjacentHTML("beforeend", data.map(htmlIritzia).join(""));
  if (berria && !data.length) {
    const tx = t();
    kont.innerHTML = `<div class="hutsik"><div class="ikur">${svgMascara(1, 0)}</div><p>${SARE.iragazkia.de_usuario ? tx.profilHutsik : SARE.iragazkia.modo === "jarraitzen" ? tx.jarioHutsik : tx.jarioHutsikDenak}</p></div>`;
  }
  if (data.length) SARE.azkena = data[data.length - 1].editada;
  if (data.length === 20) kont.insertAdjacentHTML("afterend", `<button type="button" class="botoia marino zabala" id="gehiago" data-sare="gehiago">${t().gehiagoKargatu}</button>`);
}

async function sarreraBidali(form) {
  const tx = t(), oharra = form.querySelector("#sare-oharra"), botoia = form.querySelector("[type=submit]");
  const email = form.email.value.trim(), pasahitza = form.pasahitza.value, berria = form.dataset.modua === "erregistratu";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { oharra.textContent = tx.emailOkerra; return; }
  if (pasahitza.length < 6) { oharra.textContent = tx.sareErroreak.ahula; return; }
  botoia.disabled = true; oharra.textContent = "";
  try {
    const sb = await sareaKargatu();
    const { data, error } = berria ? await sb.auth.signUp({ email, password: pasahitza }) : await sb.auth.signInWithPassword({ email, password: pasahitza });
    if (error) throw error;
    if (!data.session) {   // el proyecto pide confirmar el correo
      document.getElementById("sare-edukia").innerHTML = htmlSarrera("sartu", tx.egiaztatuEmaila(email), true);
      return;
    }
    SARE.saioa = data.session; SARE.perfil = undefined;
    await nirePerfilaKargatu();
    pintar();
  } catch (e) { oharra.textContent = sareErrorea(e); botoia.disabled = false; }
}
async function perfilaBidali(form) {
  const tx = t(), oharra = form.querySelector("#sare-oharra"), botoia = form.querySelector("[type=submit]");
  const fila = { usuario: form.usuario.value.trim().toLowerCase(), nombre: form.nombre.value.trim(), bio: form.bio.value.trim(), color: form.color.value };
  if (!/^[a-z0-9_]{3,20}$/.test(fila.usuario)) { oharra.textContent = tx.sareErroreak.okerra; form.usuario.focus(); return; }
  if (!fila.nombre) { oharra.textContent = tx.izenaFalta; form.nombre.focus(); return; }
  if (!KOLOREAK.includes(fila.color)) fila.color = KOLOREAK[0];
  botoia.disabled = true; oharra.textContent = "";
  const sortu = form.dataset.modua === "sortu";
  const kontsulta = sortu ? SARE.sb.from("perfiles").insert({ id: SARE.saioa.user.id, ...fila }) : SARE.sb.from("perfiles").update(fila).eq("id", SARE.perfil.id);
  const { data, error } = await kontsulta.select("id, usuario, nombre, bio, color, rol").single();
  if (error) { oharra.textContent = sareErrorea(error); botoia.disabled = false; return; }
  SARE.perfil = data; pintarProfilaBotoia();
  if (sortu) sinkronizatu();
  if (vista.nombre === "profila") vista = { nombre: "profila" };
  pintar();
}
async function txaloa(id) {
  const v = SARE.iritziak.get(String(id)); if (!v || !haySesion()) return;
  const eman = !v.txalo_mio;
  const egin = (mio, n) => { v.txalo_mio = mio; v.txaloak = n; const b = document.querySelector(`[data-txalo="${id}"]`); if (b) { b.setAttribute("aria-pressed", mio); b.querySelector("span").textContent = n; } };
  const lehen = [v.txalo_mio, Number(v.txaloak)];
  egin(eman, lehen[1] + (eman ? 1 : -1));
  const { error } = eman ? await SARE.sb.from("txaloak").insert({ usuario_id: SARE.perfil.id, valoracion_id: v.id })
    : await SARE.sb.from("txaloak").delete().eq("usuario_id", SARE.perfil.id).eq("valoracion_id", v.id);
  if (error && error.code !== "23505") egin(...lehen);
}
async function jarraitu(bai) {
  const p = SARE.profila; if (!p || !haySesion()) return;
  const botoia = document.querySelector("[data-jarraitu]"); botoia.disabled = true;

  botoia.disabled = false;

async function iritziaEzabatu(id) {

}

async function irten() {

document.addEventListener("submit", e => {
  if (e.target.id === "sarrera-form") { e.preventDefault(); sarreraBidali(e.target); }
  if (e.target.id === "perfil-form") { e.preventDefault(); perfilaBidali(e.target); }
});
document.addEventListener("input", e => { if (e.target.id === "bilatu") bilatu(e.target.value); });
function sareKlik(e) {
  const q = s => e.target.closest(s);
  let el;
  if ((el = q("[data-profila]"))) { irA("profila", { usuario: el.dataset.profila }); return true; }
  if (q("#profila-botoia")) { cerrarAjustes(); irA("profila"); return true; }
  if ((el = q("[data-sarrera]"))) { document.getElementById("sare-edukia").innerHTML = htmlSarrera(el.dataset.sarrera); return true; }
  if ((el = q("[data-jario-modua]"))) { vista.modua = el.dataset.jarioModua; pintar(); return true; }
  if ((el = q("[data-txalo]"))) { txaloa(el.dataset.txalo); return true; }
  if ((el = q("[data-jarraitu]"))) { jarraitu(el.dataset.jarraitu === "bai"); return true; }
  if ((el = q("[data-iritzia-ezabatu]"))) { iritziaEzabatu(Number(el.dataset.iritziaEzabatu)); return true; }
  if ((el = q("[data-sare]"))) {
    const a = el.dataset.sare;
    if (a === "berriz" || a === "eguneratu") pintar();
    else if (a === "gehiago") { el.disabled = true; iritziakKargatu(SARE.iragazkia, false); }
    else if (a === "editatu") document.getElementById("profila-editatu").innerHTML = htmlPerfilForm(SARE.perfil);
    else if (a === "editatu-utzi") document.getElementById("profila-editatu").innerHTML = "";
    else if (a === "argitaratu") { sinPublicar().forEach(v => { v.sare = "zain"; }); guardar(); el.disabled = true; sinkronizatu().then(pintar); }
    else if (a === "irten") { cerrarAjustes(); irten().then(() => irA("jarioa")); }
    else if (a === "kontua-ezabatu") {
      if (!SARE.kontuaArmatua) { SARE.kontuaArmatua = true; abrirAjustes(); setTimeout(() => { if (SARE.kontuaArmatua) { SARE.kontuaArmatua = false; if (!document.getElementById("orria").hidden) abrirAjustes(); } }, 4000); }
      else { SARE.kontuaArmatua = false; el.disabled = true; kontuaEzabatu().then(ok => { cerrarAjustes(); if (ok) irA("jarioa"); }); }
    }
    return true;
  }
  return false;
}

// ================================================================ Transmitir el móvil a un ordenador
// El ordenador abre la app con «#pantalla» y enseña un código. En el móvil, Ajustes → «Transmitir a un
// ordenador» y ese código. El móvil manda lo que tiene en pantalla (comprimido) por un canal de Supabase
// Realtime y el ordenador lo dibuja en un marco del tamaño del móvil, siguiendo cada cambio y el desplazamiento.
// No hace falta cuenta. Los navegadores de móvil no dejan grabar la pantalla: por eso se envía la página, no un vídeo.

const PANTAILA = { kanala: null, kodea: null, behatzailea: null, tenp: null, oihalTenp: null, azkenak: {}, azkenOihalak: "", bidaltzen: false };
const KODE_LETRAK = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
// Partes de la app que se ven (en este orden); las dos primeras van dentro del marco con desplazamiento.
const ISPILU_ZATIAK = ["header.goiburua", "#edukia", "#nabigazioa", "#arbela", "#baloratu", "#istorioa", "#orria"];

async function trinkotu(obj) {
  const json = JSON.stringify(obj);
  if (typeof CompressionStream !== "function") return { j: json };
  const buf = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return { z: btoa(bin) };
}
async function zabaldu(p) {
  if (p.j) return JSON.parse(p.j);
  const buf = Uint8Array.from(atob(p.z), c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}

// ---------------------------------------------------------------- En el móvil

function ispiluZatia(el, oihalak) {
  if (!el || el.hidden) return "";
  const k = el.cloneNode(true);
  const jatorriak = el.querySelectorAll("canvas"), kopiak = k.querySelectorAll("canvas");
  jatorriak.forEach((c, i) => {
    const img = document.createElement("img");
    img.className = c.className; img.dataset.oihala = oihalak.length;
    img.style.cssText = `${c.style.cssText};width:${c.clientWidth}px;height:${c.clientHeight}px;display:block`;
    try { oihalak.push(c.width && c.height ? c.toDataURL("image/jpeg", .6) : ""); } catch (e) { oihalak.push(""); }
    kopiak[i].replaceWith(img);
  });
  // Lo escrito en los campos (las contraseñas, solo como puntos).
  const ein = el.querySelectorAll("input, textarea, select"), kin = k.querySelectorAll("input, textarea, select");
  ein.forEach((x, i) => {
    const y = kin[i];
    if (x.tagName === "TEXTAREA") y.textContent = x.value;
    else if (x.tagName === "SELECT") [...y.options].forEach((o, j) => o.toggleAttribute("selected", j === x.selectedIndex));
    else if (x.type === "checkbox" || x.type === "radio") y.toggleAttribute("checked", x.checked);
    else y.setAttribute("value", x.type === "password" ? "x".repeat(x.value.length) : x.value);
    y.removeAttribute("autofocus");
  });
  k.querySelectorAll("script").forEach(s => s.remove());
  return k.outerHTML;
}
async function ispiluaBidali(osoa = false) {
  PANTAILA.tenp = null;
  if (!PANTAILA.kanala || PANTAILA.bidaltzen) { if (PANTAILA.kanala) ispiluaProgramatu(); return; }
  if (osoa) { PANTAILA.azkenak = {}; PANTAILA.azkenOihalak = ""; }
  const oihalak = [], zatiak = {};
  ISPILU_ZATIAK.forEach((sel, i) => { const html = ispiluZatia(document.querySelector(sel), oihalak); if (PANTAILA.azkenak[i] !== html) zatiak[i] = PANTAILA.azkenak[i] = html; });
  const oihalakJson = JSON.stringify(oihalak), oihalBerriak = oihalakJson !== PANTAILA.azkenOihalak;
  PANTAILA.azkenOihalak = oihalakJson;
  const datuak = { zatiak, y: scrollY, bal: document.getElementById("baloratu").scrollTop, arb: document.getElementById("arbela").scrollTop,
    w: innerWidth, h: innerHeight, lang: G.lang, ...(oihalBerriak ? { oihalak } : {}) };
  PANTAILA.bidaltzen = true;
  try { await PANTAILA.kanala.send({ type: "broadcast", event: "irudia", payload: await trinkotu(datuak) }); }
  catch (e) { /* se reintenta con el siguiente cambio */ }
  finally { PANTAILA.bidaltzen = false; }
}
function ispiluaProgramatu(osoa = false) {
  if (!PANTAILA.kanala) return;
  if (osoa) { clearTimeout(PANTAILA.tenp); PANTAILA.tenp = setTimeout(() => ispiluaBidali(true), 50); return; }
  if (!PANTAILA.tenp) PANTAILA.tenp = setTimeout(() => ispiluaBidali(false), 200);
}
async function pantailaKonektatu(kodea) {
  const tx = t(), oharra = document.getElementById("pantaila-oharra");
  kodea = String(kodea || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (kodea.length !== 6) { if (oharra) oharra.textContent = tx.kodeOkerra; return; }
  try {
    const sb = await sareaKargatu();
    await pantailaGelditu(false);
    const kanala = sb.channel(`pantaila-${kodea}`, { config: { broadcast: { self: false } } });
    kanala.on("broadcast", { event: "eskatu" }, () => ispiluaProgramatu(true));
    await new Promise((ok, ko) => { const tenp = setTimeout(() => ko(new Error("denbora")), 10000);
      kanala.subscribe(s => { if (s === "SUBSCRIBED") { clearTimeout(tenp); ok(); } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT") { clearTimeout(tenp); ko(new Error(s)); } }); });
    Object.assign(PANTAILA, { kanala, kodea });
    PANTAILA.behatzailea = new MutationObserver(() => ispiluaProgramatu());
    PANTAILA.behatzailea.observe(document.body, { subtree: true, childList: true, attributes: true, characterData: true });
    addEventListener("scroll", ispiluKorritu, { passive: true, capture: true });
    addEventListener("input", ispiluKorritu, true);
    addEventListener("resize", ispiluKorritu);
    // La constelación se mueve sola: su imagen se manda una vez por segundo.
    PANTAILA.oihalTenp = setInterval(() => { if (document.querySelector("#edukia canvas, #istorioa canvas")) ispiluaProgramatu(); }, 1000);
    pintarTransmisioa(); abrirAjustes();
    ispiluaProgramatu(true);
  } catch (e) { if (oharra) oharra.textContent = tx.pantailaErrorea; }
}
function ispiluKorritu() { ispiluaProgramatu(); }
async function pantailaGelditu(abisatu = true) {
  const k = PANTAILA.kanala; if (!k) return;
  if (abisatu) { try { await k.send({ type: "broadcast", event: "amaiera", payload: {} }); } catch (e) {} }
  PANTAILA.behatzailea?.disconnect(); clearTimeout(PANTAILA.tenp); clearInterval(PANTAILA.oihalTenp);
  removeEventListener("scroll", ispiluKorritu, { capture: true }); removeEventListener("input", ispiluKorritu, true); removeEventListener("resize", ispiluKorritu);
  Object.assign(PANTAILA, { kanala: null, kodea: null, behatzailea: null, tenp: null, azkenak: {}, azkenOihalak: "" });
  try { SARE.sb.removeChannel(k); } catch (e) {}
  pintarTransmisioa();
}

}
function htmlPantailaAjustes() {

// ---------------------------------------------------------------- En el ordenador (#pantalla)

const pantailaModua = /^#(pantalla|pantaila)$/.test(location.hash);
const ORDENAGAILUA = { kanala: null, konektatuta: false, oihalak: [], datuak: null };
function pantailaKodea() {
  let k = null;
  try { k = sessionStorage.getItem("txalometroa-pantaila"); } catch (e) {}
  if (!/^[A-Z0-9]{6}$/.test(k || "")) {
    const r = new Uint32Array(6); crypto.getRandomValues(r);
    k = [...r].map(n => KODE_LETRAK[n % KODE_LETRAK.length]).join("");
    try { sessionStorage.setItem("txalometroa-pantaila", k); } catch (e) {}
  }
  return k;
}
function itxaronMarraztu() {
  const tx = t(), el = document.getElementById("pantaila"), kodea = pantailaKodea();
  ORDENAGAILUA.konektatuta = false; ORDENAGAILUA.datuak = null;
  el.innerHTML = `<div class="pantaila-itxaron">
    <div class="pantaila-logoa">${svgLogoLiquido(10, { animar: false, etiqueta: "Txalometroa" })}</div>
    <h1>${tx.pantailaTitulua}</h1>
    ${sareaPrest() ? `<ol>${tx.pantailaPausoak.map(p => `<li>${p}</li>`).join("")}</ol>
      <div class="pantaila-kodea" aria-label="${tx.kodea}">${kodea.split("").map(c => `<span>${c}</span>`).join("")}</div>
      <p class="itxaroten"><i></i>${tx.itxaroten}</p>` : `<p>${tx.pantailaSareGabe}</p>`}
    <div class="pantaila-hizkuntza"><button type="button" data-pantaila-lang="eu" aria-pressed="${G.lang === "eu"}">EUS</button><button type="button" data-pantaila-lang="es" aria-pressed="${G.lang === "es"}">ES</button></div>
    <a class="esteka" href="${location.pathname}" data-pantaila="app">${tx.appraItzuli}</a></div>`;
}
async function ispiluaMarraztu(d) {
  const el = document.getElementById("pantaila");
  if (!ORDENAGAILUA.konektatuta) {
    ORDENAGAILUA.konektatuta = true;
    el.innerHTML = `<div class="ispilu-eszena"><div class="ispilu-tokia"><div class="ispilua" id="ispilua">
        <div class="ispilu-gorputza" id="ispilu-gorputza"><div data-z="0"></div><div data-z="1"></div></div>
        ${ISPILU_ZATIAK.slice(2).map((_, i) => `<div data-z="${i + 2}"></div>`).join("")}</div></div>
      <p class="ispilu-oina"><span class="zuzenean"><i></i>${t().zuzenean}</span> · ${pantailaKodea()}</p></div>`;
  }
  const ispilua = document.getElementById("ispilua");
  for (const [i, html] of Object.entries(d.zatiak || {})) ispilua.querySelector(`[data-z="${i}"]`).innerHTML = html;
  if (d.oihalak) ORDENAGAILUA.oihalak = d.oihalak;
  ispilua.querySelectorAll("img[data-oihala]").forEach(img => { const src = ORDENAGAILUA.oihalak[img.dataset.oihala]; if (src && img.getAttribute("src") !== src) img.src = src; });
  // Tamaño del móvil, escalado para caber en la pantalla del ordenador.
  const w = d.w || 390, h = d.h || 844, s = Math.min((innerHeight - 70) / h, (innerWidth - 40) / w, 2.4);
  ispilua.style.width = `${w}px`; ispilua.style.height = `${h}px`; ispilua.style.transform = `scale(${s})`;
  const tokia = ispilua.parentElement; tokia.style.width = `${w * s}px`; tokia.style.height = `${h * s}px`;
  document.getElementById("ispilu-gorputza").scrollTop = d.y || 0;
  const bal = ispilua.querySelector("#baloratu"); if (bal) bal.scrollTop = d.bal || 0;
  const arb = ispilua.querySelector("#arbela"); if (arb) arb.scrollTop = d.arb || 0;
  if (d.lang) document.documentElement.lang = d.lang;
  ORDENAGAILUA.datuak = d;
}
async function pantailaHasi() {
  document.body.classList.add("pantaila-modua");
  document.getElementById("pantaila").hidden = false;
  itxaronMarraztu();
  if (!sareaPrest()) return;
  let sb; try { sb = await sareaKargatu(); } catch (e) { return; }
  const kanala = ORDENAGAILUA.kanala = sb.channel(`pantaila-${pantailaKodea()}`, { config: { broadcast: { self: false } } });
  const eskatu = () => kanala.send({ type: "broadcast", event: "eskatu", payload: {} }).catch(() => {});
  kanala.on("broadcast", { event: "irudia" }, async ({ payload }) => { try { await ispiluaMarraztu(await zabaldu(payload)); } catch (e) { eskatu(); } });
  kanala.on("broadcast", { event: "amaiera" }, () => itxaronMarraztu());
  kanala.subscribe(s => { if (s === "SUBSCRIBED") eskatu(); });
  // Si el móvil ya estaba conectado (el ordenador se recargó), se le pide la pantalla entera.
  setInterval(() => { if (!ORDENAGAILUA.konektatuta) eskatu(); }, 5000);
  addEventListener("resize", () => { if (ORDENAGAILUA.datuak) ispiluaMarraztu({ ...ORDENAGAILUA.datuak, zatiak: {} }); });
}

function pantailaKlik(e) {
  const q = s => e.target.closest(s);
  let el;
  if (q("#transmisioa")) { pantailaGelditu(); return true; }
  if ((el = q("[data-pantaila]"))) { if (el.dataset.pantaila === "gelditu") { pantailaGelditu().then(abrirAjustes); return true; } return false; }
  if ((el = q("[data-pantaila-lang]"))) { G.lang = el.dataset.pantailaLang; guardar(); itxaronMarraztu(); return true; }
  return false;
}
document.addEventListener("submit", e => { if (e.target.id === "pantaila-form") { e.preventDefault(); pantailaKonektatu(e.target.kodea.value); } });

// ================================================================ Funciones en directo y pizarra
// Hika (perfil con rol admin) programa funciones con fecha y hora. A esa hora salen «En directo»
// arriba de Obras. Al pulsar «Terminar obra», el móvil de quien la termina muestra la cuenta atrás
// y en el del público se abre la pizarra con las valoraciones y los comentarios, en tiempo real.

const ZUZEN = { funciones: [], kanala: null, tic: null, galdeketa: null, egoerak: "", pizarra: null, armatua: null, atzeratu: null };
const ZUZENEKO_OBRAK = [];   // obras nuevas creadas con una función (no están en el catálogo)
const ORDU = 3600e3;
const funcionObra = f => f.obra || `zuzen-${f.id}`;
const esAdmin = () => haySesion() && SARE.perfil.rol === "admin";
const arbelakItxita = () => new Set(G.arbelaItxita || []);

// laster (aún no ha empezado) · zuzenean (en directo) · arbela (pizarra abierta) · amaituta · iraganda
function funcionEgoera(f, ahora = Date.now()) {
  if (f.estado === "pizarra") return ahora < Date.parse(f.pizarra_hasta) ? "arbela" : "amaituta";
  const hasi = Date.parse(f.empieza);
  return ahora < hasi ? "laster" : ahora < hasi + 4 * ORDU ? "zuzenean" : "iraganda";
}
function obrakErregistratu() {
  ZUZENEKO_OBRAK.length = 0;
  for (const f of ZUZEN.funciones.filter(f => !f.obra)) {
    const genero = GENEROAK[f.genero] ? f.genero : GEN_ORDEN[0];
    ZUZENEKO_OBRAK.push({ id: funcionObra(f), eu: f.titulo, es: f.titulo, genero, urtea: new Date(f.empieza).getFullYear(),
      imagen: cartelPrueba(f.titulo, genero, azarra(f.id)), zuzenean: true });
  }
  aplicarPruebas();
}
const bi = n => String(n).padStart(2, "0");
function geratzen(f) {
  const s = Math.max(0, Math.round((Date.parse(f.pizarra_hasta) - Date.now()) / 1000));
  return s >= 3600 ? `${Math.floor(s / 3600)}:${bi(Math.floor(s / 60) % 60)}:${bi(s % 60)}` : `${bi(Math.floor(s / 60))}:${bi(s % 60)}`;
}
const orduaTestua = iso => new Intl.DateTimeFormat(G.lang, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));

// ---------------------------------------------------------------- Datos y tiempo real

async function funcionesKargatu() {
  if (!SARE.sb) return;
  const { data, error } = await SARE.sb.rpc("funciones_activas");
  if (error || !Array.isArray(data)) return;
  ZUZEN.funciones = data;
  if (ZUZEN.pizarra) ZUZEN.pizarra.f = data.find(f => f.id === ZUZEN.pizarra.f.id) || ZUZEN.pizarra.f;
  obrakErregistratu();
  zuzenTic(true);
}
function zuzenaEntzun() {
  if (ZUZEN.kanala || !SARE.sb) return;
  const berriz = () => { clearTimeout(ZUZEN.atzeratu); ZUZEN.atzeratu = setTimeout(() => { funcionesKargatu(); if (ZUZEN.pizarra) pizarraKargatu(); }, 300); };
  ZUZEN.kanala = SARE.sb.channel("zuzenean")
    .on("postgres_changes", { event: "*", schema: "public", table: "funciones" }, berriz)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "comentarios" }, berriz)
    .on("postgres_changes", { event: "*", schema: "public", table: "valoraciones" }, berriz)
    .subscribe();
  // Por si el tiempo real no llega: se repasa cada 30 s (y cada 8 s con la pizarra abierta).
  ZUZEN.galdeketa = setInterval(() => { if (!document.hidden) funcionesKargatu(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) funcionesKargatu(); });
}
async function zuzenaHasi() {
  try { await sareaHasi(); } catch (e) { return; }
  await funcionesKargatu();
  zuzenaEntzun();
  if (!ZUZEN.tic) ZUZEN.tic = setInterval(() => zuzenTic(false), 1000);
}
// Cada segundo: cuentas atrás, cambios de estado (empieza, se abre o se cierra la pizarra) y abrir la pizarra.
function zuzenTic(behartu) {
  const ahora = Date.now(), egoerak = ZUZEN.funciones.map(f => `${f.id}:${funcionEgoera(f, ahora)}`).join(",");
  if (behartu || egoerak !== ZUZEN.egoerak) {
    ZUZEN.egoerak = egoerak;
    const atala = document.getElementById("zuzenean-atala"); if (atala) atala.outerHTML = htmlZuzenean();
    const zerrenda = document.getElementById("funtzioak-zerrenda"); if (zerrenda) zerrenda.innerHTML = htmlFuntzioZerrenda();
  }
  if (ZUZEN.pizarra && funcionEgoera(ZUZEN.pizarra.f, ahora) !== ZUZEN.pizarra.egoera) arbelaMarraztu();   // se abre o se cierra
  document.querySelectorAll("[data-atzera]").forEach(el => { const f = ZUZEN.funciones.find(x => x.id === Number(el.dataset.atzera)); if (f?.pizarra_hasta) el.textContent = geratzen(f); });
  if (!ZUZEN.pizarra && !pantailaModua) {
    const itxita = arbelakItxita();
    const f = ZUZEN.funciones.find(f => funcionEgoera(f, ahora) === "arbela" && !itxita.has(f.id));
    if (f) arbelaIreki(f.id, haySesion() && f.creada_por === SARE.perfil.id ? "atzera" : "arbela");
  }
}

// ---------------------------------------------------------------- «En directo» arriba de Obras

function htmlZuzenean() {
  const tx = t(), ahora = Date.now();
  const fs = ZUZEN.funciones.map(f => ({ f, e: funcionEgoera(f, ahora), o: obraCat(funcionObra(f)) })).filter(x => x.o);
  const nagusiak = fs.filter(x => x.e === "zuzenean" || x.e === "arbela"), hurrengoak = fs.filter(x => x.e === "laster").slice(0, 3);
  return `<div id="zuzenean-atala">${nagusiak.map(({ f, e, o }) => `<article class="zuzen-txartela e-${e}">
      <div class="argazkia"><img src="${esc(o.imagen)}" alt=""><span class="zuzenean"><i></i>${e === "arbela" ? tx.arbelaIrekita : tx.zuzenean}</span></div>
      <div class="gorputza"><h2>${esc(izena(o))}</h2><p>${esc(f.lugar ? `${f.lugar} · ` : "")}${orduaTestua(f.empieza)}</p>
        ${e === "arbela" ? `<p class="atzera-kontua"><span>${tx.arbelaIxten}</span> <b data-atzera="${f.id}">${geratzen(f)}</b></p>` : ""}
        <div class="botoiak"><button type="button" class="botoia" data-baloratu="${esc(o.id)}">${tx.txalotu}</button>
          ${e === "arbela" ? `<button type="button" class="botoia krema" data-arbela="${f.id}">${tx.arbelaIkusi}</button>` : ""}
          ${e === "zuzenean" && esAdmin() ? `<button type="button" class="botoia marino" data-amaitu="${f.id}">${ZUZEN.armatua === f.id ? tx.ziur : tx.amaituObra}</button>` : ""}</div></div>
    </article>`).join("")}
    ${hurrengoak.length ? `<h2 class="azpititulua">${tx.hurrengoFuntzioak}</h2><ul class="hurrengoak">${hurrengoak.map(({ f, o }) => `<li><button type="button" data-fitxa="${esc(o.id)}">
      <img src="${esc(o.imagen)}" alt="" loading="lazy"><span><b>${esc(izena(o))}</b><small>${orduaTestua(f.empieza)}${f.lugar ? ` · ${esc(f.lugar)}` : ""}</small></span><span class="falta">${denboraLehen(f.empieza)}</span></button></li>`).join("")}</ul>` : ""}
  </div>`;
}

// ---------------------------------------------------------------- Programar y terminar (admin, en su perfil)

function htmlFuntzioZerrenda() {
  const tx = t(), ahora = Date.now();
  if (!ZUZEN.funciones.length) return `<p class="azalpena">${tx.funtzioGabe}</p>`;
  return `<ul class="funtzio-zerrenda">${ZUZEN.funciones.map(f => {
    const e = funcionEgoera(f, ahora), o = obraCat(funcionObra(f));
    return `<li class="e-${e}"><div><b>${esc(o ? izena(o) : f.titulo)}</b><small>${orduaTestua(f.empieza)}${f.lugar ? ` · ${esc(f.lugar)}` : ""} · ${tx.arbelaMin(f.minutos_pizarra)}</small>
        <span class="egoera-txip e-${e}">${tx.egoerak[e]}${e === "arbela" ? ` · <b data-atzera="${f.id}">${geratzen(f)}</b>` : ""}</span></div>
      <div class="botoiak">${e === "zuzenean" ? `<button type="button" class="botoia" data-amaitu="${f.id}">${ZUZEN.armatua === f.id ? tx.ziur : tx.amaituObra}</button>` : ""}
        ${e === "arbela" ? `<button type="button" class="botoia" data-arbela="${f.id}" data-arbela-modua="atzera">${tx.atzeraKontua}</button>` : ""}
        <button type="button" class="esteka" data-funtzioa-ezabatu="${f.id}">${ZUZEN.armatua === -f.id ? tx.ziurEzabatu : tx.ezabatuIritzia}</button></div></li>`;
  }).join("")}</ul>`;
}
function htmlFuntzioakAdmin() {
  const tx = t(), orain = new Date(Date.now() + 10 * 60e3);
  const eguna = `${orain.getFullYear()}-${bi(orain.getMonth() + 1)}-${bi(orain.getDate())}`, ordua = `${bi(orain.getHours())}:${bi(Math.floor(orain.getMinutes() / 5) * 5)}`;

        <div class="obra-berria" hidden>

        </div>
        <div class="bi-zutabe"><label class="eremua">${tx.data}<input type="date" name="eguna" value="${eguna}" required></label>
          <label class="eremua">${tx.ordua}<input type="time" name="ordua" value="${ordua}" required></label></div>
        <label class="eremua">${tx.lekua} <small>(${tx.aukerakoa})</small><input name="lugar" maxlength="80"></label>
        <label class="eremua">${tx.arbelaMinutuak}<input type="number" name="minutuak" value="10" min="1" max="120" inputmode="numeric"></label>
        <p class="oharra" id="funtzio-oharra" aria-live="polite"></p>
        <button type="submit" class="botoia">${tx.programatu}</button>

async function funtzioaBidali(form) {
  const tx = t(), oharra = form.querySelector("#funtzio-oharra"), botoia = form.querySelector("[type=submit]");
  const obra = form.obra.value, titulo = form.titulo.value.trim(), hasi = new Date(`${form.eguna.value}T${form.ordua.value}`);
  if (!obra && !titulo) { oharra.textContent = tx.tituluaFalta; form.titulo.focus(); return; }
  if (!form.eguna.value || !form.ordua.value || isNaN(hasi)) { oharra.textContent = tx.dataOkerra; return; }
  const minutuak = Math.max(1, Math.min(120, Math.round(Number(form.minutuak.value) || 10)));
  botoia.disabled = true; oharra.textContent = "";
  const { error } = await SARE.sb.from("funciones").insert({ obra: obra || null, titulo: obra ? "" : titulo, genero: obra ? obraCat(obra)?.genero || GEN_ORDEN[0] : form.genero.value,
    lugar: form.lugar.value.trim(), empieza: hasi.toISOString(), minutos_pizarra: minutuak, creada_por: SARE.perfil.id });
  botoia.disabled = false;
  if (error) { oharra.textContent = sareErrorea(error); return; }
  form.closest("details").open = false; form.reset();
  await funcionesKargatu();
}
// Los botones que borran o terminan piden una segunda pulsación en 4 s.
function armatu(gakoa) {
  if (ZUZEN.armatua === gakoa) { ZUZEN.armatua = null; return true; }
  ZUZEN.armatua = gakoa; zuzenTic(true);
  setTimeout(() => { if (ZUZEN.armatua === gakoa) { ZUZEN.armatua = null; zuzenTic(true); } }, 4000);
  return false;
}
async function funtzioaAmaitu(id) {
  if (!armatu(id)) return;
  const { data, error } = await SARE.sb.rpc("terminar_funcion", { p_id: id });
  if (error) return;
  const f = data?.[0]; if (f) ZUZEN.funciones = ZUZEN.funciones.map(x => x.id === f.id ? f : x);
  zuzenTic(true);
  arbelaIreki(id, "atzera");
  funcionesKargatu();
}
async function funtzioaEzabatu(id) {
  if (!armatu(-id)) return;
  const { error } = await SARE.sb.from("funciones").delete().eq("id", id);
  if (!error) funcionesKargatu();
}

// ---------------------------------------------------------------- Pizarra y cuenta atrás

function arbelaIreki(id, modua = "arbela") {
  const f = ZUZEN.funciones.find(x => x.id === id); if (!f) return;
  ZUZEN.pizarra = { f, modua, zerrenda: [], ezagunak: new Set(), lehena: true };
  const el = document.getElementById("arbela"); el.hidden = false; document.body.style.overflow = "hidden";
  arbelaMarraztu(); pizarraKargatu();
  clearInterval(ZUZEN.pizarraTenp); ZUZEN.pizarraTenp = setInterval(pizarraKargatu, 8000);
}
function arbelaItxi() {
  const p = ZUZEN.pizarra; if (!p) return;
  G.arbelaItxita = [...arbelakItxita(), p.f.id].slice(-30); guardar();
  clearInterval(ZUZEN.pizarraTenp); ZUZEN.pizarra = null;
  const el = document.getElementById("arbela"); el.hidden = true; el.innerHTML = ""; document.body.style.overflow = "";
}
async function pizarraKargatu() {
  const p = ZUZEN.pizarra; if (!p || !SARE.sb) return;
  const { data, error } = await SARE.sb.rpc("pizarra", { p_funcion: p.f.id });
  if (error || ZUZEN.pizarra !== p) return;
  p.zerrenda = data || [];
  arbelaZerrenda();
}
function arbelaMarraztu() {
  const p = ZUZEN.pizarra, tx = t(), el = document.getElementById("arbela"); if (!p) return;
  const o = obraCat(funcionObra(p.f)), e = funcionEgoera(p.f), irekita = e === "arbela";
  p.egoera = e;
  const goia = `<div class="arbela-goia"><button type="button" class="atzera" data-arbela-itxi aria-label="${tx.atzera}">${ICONOS.itxi}</button>
    ${p.f.creada_por === SARE.perfil?.id ? `<button type="button" class="esteka" data-arbela-modua="${p.modua === "atzera" ? "arbela" : "atzera"}">${p.modua === "atzera" ? tx.arbelaIkusi : tx.atzeraKontua}</button>` : ""}</div>`;
  if (p.modua === "atzera") {
    el.innerHTML = `${goia}<div class="atzera-pantaila"><p class="zuzenean"><i></i>${irekita ? tx.arbelaIrekita : tx.arbelaItxitaIzen}</p>
      <h2>${esc(o ? izena(o) : p.f.titulo)}</h2>
      <div class="atzera-erraldoia" data-atzera="${p.f.id}" role="timer">${geratzen(p.f)}</div>
      <p class="azalpena">${irekita ? tx.atzeraAzal : tx.arbelaItxita}</p>
      <div class="estatistikak" id="arbela-zenbakiak"></div></div>`;
  } else {
    el.innerHTML = `${goia}<div class="arbela-markoa"><div class="arbela-azala">
        <header><span class="arbela-izena">${tx.arbela}</span><h2>${esc(o ? izena(o) : p.f.titulo)}</h2>
          <p>${irekita ? `${tx.arbelaIxten} <b data-atzera="${p.f.id}">${geratzen(p.f)}</b>` : tx.arbelaItxita}</p><p class="arbela-zenbakiak" id="arbela-zenbakiak"></p></header>
        <ul class="klarionak" id="arbela-zerrenda" aria-live="polite"></ul></div></div>
      <div class="arbela-oina">${irekita ? (haySesion() ? `<form id="iruzkin-form" class="iruzkin-form"><input name="testua" maxlength="280" placeholder="${tx.iruzkinIrud}" aria-label="${tx.iruzkinIrud}" autocomplete="off"><button type="submit" class="botoia">${tx.bidaliIruzkina}</button></form><p class="oharra" id="iruzkin-oharra" aria-live="polite"></p>`
          : `<button type="button" class="esteka" data-arbela-sartu>${tx.sartuIruzkintzeko}</button>`) : ""}
        ${o ? `<button type="button" class="botoia krema zabala" data-baloratu="${esc(o.id)}">${tx.txalotu}</button>` : ""}</div>`;
  }
  arbelaZerrenda();
}
function arbelaZerrenda() {
  const p = ZUZEN.pizarra, tx = t(); if (!p) return;
  const balorazioak = p.zerrenda.filter(x => x.tipo === "balorazioa"), notak = balorazioak.map(x => Number(x.nota)).filter(x => x > 0);
  const media = notak.length ? notak.reduce((a, b) => a + b, 0) / notak.length : null, iruzkinak = p.zerrenda.length - balorazioak.length;
  const zenb = document.getElementById("arbela-zenbakiak");
  if (zenb && p.modua === "atzera") zenb.innerHTML = `<div><b>${balorazioak.length}</b><span>${tx.balorazioak}</span></div><div><b>${iruzkinak}</b><span>${tx.iruzkinak}</span></div><div><b>${fmt(media)}</b><span>${tx.nota}</span></div>`;
  else if (zenb) zenb.textContent = `${balorazioak.length} ${tx.balorazioak} · ${iruzkinak} ${tx.iruzkinak}${media !== null ? ` · ${tx.nota} ${fmt(media)}` : ""}`;
  const ul = document.getElementById("arbela-zerrenda"); if (!ul) return;
  if (!p.zerrenda.length) { ul.innerHTML = `<li class="hutsa">${tx.arbelaHutsik}</li>`; return; }
  ul.innerHTML = p.zerrenda.map(x => {
    const gakoa = `${x.tipo}-${x.id}`, berria = !p.lehena && !p.ezagunak.has(gakoa), biraketa = (hash(gakoa) % 7) - 3;
    return `<li class="${x.tipo}${berria ? " berria" : ""}" style="--r:${biraketa}deg">${x.tipo === "balorazioa" ? `<span class="nota">${fmt(Number(x.nota))}</span>` : ""}
      ${x.texto ? `<p>${esc(x.texto)}</p>` : ""}<small>${esc(x.nombre)} · @${esc(x.usuario)}</small></li>`;
  }).join("");
  p.zerrenda.forEach(x => p.ezagunak.add(`${x.tipo}-${x.id}`));
  if (p.zerrenda.length) p.lehena = false;
}
async function iruzkinaBidali(form) {
  const tx = t(), testua = form.testua.value.trim(), oharra = document.getElementById("iruzkin-oharra");
  if (!testua || !ZUZEN.pizarra || !haySesion()) return;
  const botoia = form.querySelector("[type=submit]"); botoia.disabled = true;
  const { error } = await SARE.sb.from("comentarios").insert({ funcion_id: ZUZEN.pizarra.f.id, usuario_id: SARE.perfil.id, texto: testua.slice(0, 280) });
  botoia.disabled = false;
  if (error) { if (oharra) oharra.textContent = error.code === "42501" ? tx.arbelaItxita : sareErrorea(error); return; }
  form.testua.value = ""; if (oharra) oharra.textContent = "";
  pizarraKargatu();
}

function zuzenKlik(e) {
  const q = s => e.target.closest(s);
  let el;
  if ((el = q("[data-arbela-itxi]"))) { arbelaItxi(); return true; }
  if ((el = q("[data-arbela-sartu]"))) { arbelaItxi(); irA("jarioa"); return true; }
  if ((el = q("[data-arbela]"))) { arbelaIreki(Number(el.dataset.arbela), el.dataset.arbelaModua || "arbela"); return true; }
  if ((el = q("[data-arbela-modua]"))) { if (ZUZEN.pizarra) { ZUZEN.pizarra.modua = el.dataset.arbelaModua; arbelaMarraztu(); } return true; }
  if ((el = q("[data-amaitu]"))) { funtzioaAmaitu(Number(el.dataset.amaitu)); return true; }
  if ((el = q("[data-funtzioa-ezabatu]"))) { funtzioaEzabatu(Number(el.dataset.funtzioaEzabatu)); return true; }
  return false;
}
document.addEventListener("submit", e => {
  if (e.target.id === "funtzio-form") { e.preventDefault(); funtzioaBidali(e.target); }
  if (e.target.id === "iruzkin-form") { e.preventDefault(); iruzkinaBidali(e.target); }
});
document.addEventListener("change", e => {
  if (e.target.name === "obra" && e.target.closest("#funtzio-form")) e.target.form.querySelector(".obra-berria").hidden = !!e.target.value;
});

// ================================================================ Confeti

function konfetia() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("konfetia"), ctx = c.getContext("2d");
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const col = ["#c80000", "#0d0d0d", "#fdeec7", "#c8361b", "#fffdf0"];
  const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .4, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4,
    r: Math.random() * 6 + 4, c: col[Math.floor(Math.random() * col.length)], a: Math.random() * Math.PI, va: (Math.random() - .5) * .3 }));
  let f = 0;
  (function paso() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (++f < 100) requestAnimationFrame(paso); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })();
}

// ================================================================ Eventos

document.addEventListener("click", e => {
  const q = s => e.target.closest(s);
  let el;
  if ((el = q("[data-vista]"))) { cerrarAjustes(); return irA(el.dataset.vista); }
  if ((el = q("[data-fitxa]"))) return irA("fitxa", { obra: el.dataset.fitxa });
  if ((el = q("[data-baloratu]"))) { e.stopPropagation(); return abrirValorar(el.dataset.baloratu); }
  if (pantailaKlik(e) || zuzenKlik(e) || sareKlik(e)) return;
  if ((el = q("[data-wrapped]"))) { if (el.dataset.wrapped === "demo") { ponerDemo(); pintar(); } return abrirWrapped(el.dataset.wrapped === "mundiala" ? "mundiala" : "zurea"); }
  if ((el = q("[data-demo]"))) { el.dataset.demo === "jarri" ? ponerDemo() : quitarDemo(); cerrarAjustes(); return pintar(); }
  if ((el = q("[data-lang]"))) { G.lang = el.dataset.lang; guardar(); pintar(); pintarInstalar(); pintarProfilaBotoia(); pintarTransmisioa(); if (ZUZEN.pizarra) arbelaMarraztu(); return abrirAjustes(); }
  if (q("#ezarpenak")) return abrirAjustes();
  if ((el = q("[data-proba-ezabatu]"))) {
    const id = el.dataset.probaEzabatu; borrarPrueba(id);
    if (vista.obra === id) vista = { nombre: "obrak" };
    pintar(); return abrirAjustes();
  }
  if ((el = q("[data-proba]"))) {
    if (el.dataset.proba === "sortu") { crearPruebas(4); pintar(); return abrirAjustes(); }
    if (!probaArmado) { probaArmado = true; abrirAjustes(); setTimeout(() => { if (probaArmado) { probaArmado = false; if (!document.getElementById("orria").hidden) abrirAjustes(); } }, 4000); return; }
    probaArmado = false; borrarPruebas(); if (vista.obra?.startsWith("proba-")) vista = { nombre: "obrak" }; pintar(); return abrirAjustes();
  }
  if (q("#instalatu") || q("[data-instalatu]")) {
    if (avisoInstalar) { avisoInstalar.prompt(); avisoInstalar.userChoice.finally(() => { avisoInstalar = null; pintarInstalar(); cerrarAjustes(); }); }
    else abrirAjustes();
    return;
  }
  if (q("#ezabatu")) {
    if (!borrarArmado) { borrarArmado = true; abrirAjustes(); setTimeout(() => { if (borrarArmado) { borrarArmado = false; if (!document.getElementById("orria").hidden) abrirAjustes(); } }, 4000); return; }
    G.valoraciones = []; G.butaka = null; guardar(); cacheRes = null; cerrarAjustes(); return pintar();
  }
  if (e.target.id === "orria") return cerrarAjustes();
  // Valorar
  if ((el = q(".maskarak button"))) {
    const cont = el.closest(".maskarak"), i = +el.dataset.i, b = el.getBoundingClientRect();
    const mitad = (e.clientX - b.left) < b.width / 2;
    const v = mitad ? i * 2 - 1 : i * 2;
    return ponerNota(cont.dataset.preg, baloraketa.notas[cont.dataset.preg] === v ? 0 : v);
  }
  if ((el = q("[data-bal]"))) {
    const a = el.dataset.bal;
    if (a === "itxi") { const volver = baloraketa?.urratsa === 2; cerrarValorar(); return volver ? irA(vista.nombre, vista) : null; }
    if (a === "konst") { cerrarValorar(); return irA("konst"); }
    if (a === "jarioa") { cerrarValorar(); return irA("jarioa"); }
    if (a === "atzera") { baloraketa.urratsa--; return pintarValorar(); }
    if (a === "hurrengoa") {
      if (baloraketa.urratsa === 0 && !CFG.nota_obra.some(g => baloraketa.notas[g])) { document.getElementById("oharra").textContent = t().gutxienez; return; }
      baloraketa.urratsa++; return pintarValorar();
    }
    if (a === "bidali") return enviarValoracion();
  }
  // Wrapped
  if ((el = q("[data-istorio]"))) {
    const a = el.dataset.istorio;
    if (a === "itxi") return cerrarWrapped();
    if (historia.pulsado) { historia.pulsado = false; return; }   // fue «mantener pulsado»: solo pausa
    return mostrarDiapo(historia.i + (a === "hurrengoa" ? 1 : -1));
  }
});
document.addEventListener("input", e => { if (e.target.dataset.testua && baloraketa) baloraketa.testuak[e.target.dataset.testua] = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ZUZEN.pizarra && !baloraketa && !historia && document.getElementById("orria").hidden) return arbelaItxi();
  const m = e.target.closest?.(".maskarak");
  if (m && ["ArrowRight", "ArrowUp", "ArrowLeft", "ArrowDown", "Home", "End"].includes(e.key)) {
    e.preventDefault(); const g = m.dataset.preg, v = baloraketa.notas[g];
    ponerNota(g, e.key === "Home" ? 0 : e.key === "End" ? 10 : v + (["ArrowRight", "ArrowUp"].includes(e.key) ? 1 : -1), true);
  }
  if (e.key === "Escape") { if (historia) cerrarWrapped(); else if (!document.getElementById("orria").hidden) cerrarAjustes(); else if (baloraketa) cerrarValorar(); }
  if (historia && e.key === "ArrowRight") mostrarDiapo(historia.i + 1);
  if (historia && e.key === "ArrowLeft") mostrarDiapo(historia.i - 1);
});
// Mantener pulsado pausa la historia, como en Instagram o Spotify.
let pulsacion = null;
document.addEventListener("pointerdown", e => {
  if (!historia || !e.target.closest(".ukitu")) return;
  pulsacion = setTimeout(() => { historia.pulsado = true; clearTimeout(historia.timer); document.getElementById("istorioa").classList.add("geldi"); }, 280);
});
document.addEventListener("pointerup", () => {
  clearTimeout(pulsacion);
  const el = document.getElementById("istorioa"); if (!historia || !el.classList.contains("geldi")) return;
  el.classList.remove("geldi"); clearTimeout(historia.timer); historia.timer = setTimeout(() => mostrarDiapo(historia.i + 1), 3000);
});
window.addEventListener("resize", () => { if (vista.nombre === "konst") { pararZerua(); hasiZerua(); } });

// ================================================================ Arranque

aplicarPruebas();
document.getElementById("marka-logoa").innerHTML = svgLogoLiquido(10, { animar: false, etiqueta: "Txalometroa" });
const h = location.hash.slice(1);
if (h.startsWith("obra-") && obraCat(h.slice(5))) vista = { nombre: "fitxa", obra: h.slice(5) };
else if (VISTAS.includes(h)) vista = { nombre: h };
else if (h === "profila" || h.startsWith("profila-")) vista = { nombre: "profila", usuario: h.slice(8) || undefined };
sareaArrancar();
pintar(); pintarInstalar();
if (pantailaModua) pantailaHasi();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
